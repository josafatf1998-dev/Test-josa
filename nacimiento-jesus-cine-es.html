/* Layout: a centered 16:9 cinematic stage, a cream caption strip under it, and a slim control bar with one segment per scene. */
:root{
  --ink:#1b1f4b;
  --ink-2:#262b66;
  --paper:#fff6e0;
  --sun:#ffc43d;
  --rose:#ff6b6b;
  --leaf:#4cb87a;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --lap5:4.5s;
  --lap6:2.8s;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;padding-inline:16px;padding-block:24px 48px;font-size:16px}
.wrap{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{margin:0;font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,2.9rem);line-height:1.05;text-wrap:balance}
.player{background:var(--ink-2);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.screen{position:relative;line-height:0;aspect-ratio:2.35/1;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;height:auto;display:block;aspect-ratio:16/9;transition:--sky1 1.6s,--sky2 1.6s,--grade 1.6s;user-select:none}
.caption{background:#07070c;color:#fff;padding:14px 22px;min-height:calc(1.4em*2 + 28px);display:flex;align-items:center;justify-content:center;text-align:center}
.caption p{margin:0;font-weight:800;font-size:clamp(1.05rem,1.2rem + .6vw,1.55rem);line-height:1.4;text-wrap:pretty}
.caption p.in{animation:capIn .5s ease-out both}
.controls{display:flex;align-items:center;gap:14px;padding:12px 16px}
#play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--sun);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#play svg{width:22px;height:22px;fill:currentColor}
#play:hover{filter:brightness(1.08)}
.segs{flex:1;min-width:0;display:flex;gap:4px}
.segs button{flex:1;min-width:0;height:30px;padding:11px 0;border:0;background:none;cursor:pointer}
.segs i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.segs i::after{content:'';display:block;height:100%;background:var(--sun);transform-origin:left;transform:scaleX(var(--p,0))}
.segs button:hover i{background:rgba(255,255,255,.32)}
#time{flex:none;font-variant-numeric:tabular-nums;font-weight:800;font-size:.9rem;opacity:.85}
button:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:8px}
.hint{margin:0;font-size:.9rem;opacity:.75;text-wrap:pretty}
#endcard{position:absolute;inset:0;display:grid;place-items:center;background:rgba(27,31,75,.5)}
#endcard[hidden]{display:none}
#replay{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3vw,1.9rem);background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:.55em 1.3em;cursor:pointer;line-height:1.2}
#replay:hover{filter:brightness(1.08)}
@media (max-width:520px){#time{display:none}.controls{gap:10px;padding-inline:12px}.caption{padding:14px 16px}}

/* render mode (used to capture the MP4): stage fills the frame, captions sit on top of the picture */
html.render body{padding:0;overflow:hidden}
html.render .wrap{max-width:none;gap:0}
html.render header,html.render .hint,html.render .controls,html.render #endcard{display:none}
html.render body{background:#000}
html.render .wrap{padding-top:109px}
html.render .player{border-radius:0;box-shadow:none;position:relative;background:#000}
html.render .caption{height:110px;min-height:0;padding:0 60px}
html.render .caption p{font-size:33px;font-weight:700}

<script>
(function(){
  if(location.hash==='#render')document.documentElement.classList.add('render');

  /* ---------- story script ---------- */
  var S=[
    {n:'Título',d:8,c:[[0,'Una historia bíblica para niños: el nacimiento de Jesús.']]},
    {n:'El ángel y María',d:14,c:[[0,'Hace mucho tiempo, en un pueblo llamado Nazaret, vivía una joven llamada María.'],[7,'Un día, el ángel Gabriel le dijo: «No tengas miedo. Vas a tener un hijo, y se llamará Jesús.»']]},
    {n:'José y María',d:14,c:[[0,'María se iba a casar con un carpintero bueno llamado José.'],[7,'Entonces el emperador ordenó que todos fueran a su ciudad a anotarse, y José y María tenían que ir a Belén.']]},
    {n:'El viaje',d:16,c:[[0,'Fue un viaje muy largo. María iba sobre un burrito, y José caminaba a su lado.'],[8.5,'Por fin, cuando ya era de noche, llegaron a Belén.']]},
    {n:'No hay lugar',d:14,c:[[0,'Pero había tanta gente en Belén que no encontraban dónde dormir.'],[7,'Tocaron a la puerta de la posada, pero el posadero dijo: «Lo siento, no queda ni un cuarto.»']]},
    {n:'El establo',d:14,c:[[0,'Pero el posadero les dijo: «Pueden quedarse en el establo, con los animales.»'],[7,'Allí había paja, una vaca, ovejas y un burrito. Era un lugar humilde, pero tranquilo.']]},
    {n:'Nace Jesús',d:18,c:[[0,'Y esa noche nació el niño Jesús.'],[5,'María lo envolvió en pañales y lo acostó en un pesebre, que es donde comen los animales.'],[12,'Y en el cielo apareció una estrella muy brillante.']]},
    {n:'Los pastores',d:16,c:[[0,'Cerca de allí, unos pastores cuidaban sus ovejas en el campo, de noche.'],[7,'De pronto apareció un ángel, y una luz brillante lo llenó todo. Los pastores sintieron mucho miedo.']]},
    {n:'La buena noticia',d:14,c:[[0,'Pero el ángel les dijo: «No teman. Les traigo una gran noticia: hoy ha nacido el Salvador.»'],[8,'Entonces muchos ángeles cantaron: «Gloria a Dios en el cielo, y paz en la tierra.»']]},
    {n:'Corren a Belén',d:14,c:[[0,'Los pastores fueron corriendo a Belén, y encontraron al niño en el pesebre, tal como el ángel les dijo.'],[8,'Se arrodillaron y le dieron gracias a Dios.']]},
    {n:'Los magos',d:16,c:[[0,'Mientras tanto, en tierras lejanas, unos sabios vieron una estrella nueva en el cielo.'],[8,'Supieron que era la estrella de un rey, y la siguieron durante muchos días.']]},
    {n:'Los regalos',d:16,c:[[0,'Por fin la estrella se detuvo sobre el lugar donde estaba el niño.'],[7,'Los sabios se arrodillaron y le dieron regalos: oro, incienso y mirra.']]},
    {n:'Fin',d:16,c:[[0,'Jesús nació en un establo, para enseñarnos que Dios ama a todos, grandes y pequeños.'],[9,'«Hoy les ha nacido un Salvador, que es Cristo el Señor.» Lucas 2:11']]}
  ];
  var TOTAL=S.reduce(function(a,s){return a+s.d},0);

  /* ---------- characters: realistic proportions (about 7.5 heads tall), shaded skin and cloth ---------- */
  var SKINS=['#d8a173','#c48658','#a96b40','#8a5231'];
  var ROBES=['#b5523b','#3f7a6e','#c98a3c','#6b5ca5','#b8a05a','#3d7fa8','#a8403f','#5b7f4a'];
  var WRAPS=['#efe7d4','#d9c9a3','#c9b48a','#e9dcc0'];
  var JOSH={robe:'#2f6f9f',mantle:'#e6d9bd',hair:'#3a2616',beard:1,band:1,skin:SKINS[1]};
  var MOSES={robe:'#6b4f35',mantle:'#efe7d4',gray:1,beard:1,wrap:'#efe7d4',skin:SKINS[1],sleeves:'long',staff:1};
  var PRIEST={robe:'#f6f1e6',plate:1,hat:1,sleeves:'long',trim:'#c8932a',belt:'#2c5aa0'};
  function folk(i){return {robe:ROBES[i%8],skin:SKINS[i%4],wrap:(i%2?WRAPS[i%4]:null),beard:(i%3===0?1:0),hair:(i%3===2?'#4a3020':'#241610')}}
  function mix(){var r={};for(var i=0;i<arguments.length;i++)Object.assign(r,arguments[i]);return r}

  function person(o){
    o=Object.assign({robe:'#4a7bd1',skin:SKINS[0],hair:'#241610',mood:'happy',arms:'down',cd:0,d:0,belt:'#6f4524',sleeves:'short',walk:false},o);
    var hc=o.gray?'#d6d6dc':o.hair,sk=o.skin,dl=o.cd+o.d,rb=o.robe;
    var it=(typeof o.walk==='number')?o.walk:'infinite';
    function A(n,dur){return 'animation:'+n+' '+dur+'s ease-in-out '+dl+'s infinite'}
    function Rt(deg){return 'transform:rotate('+deg+'deg)'}
    var LU=Rt(6),LF=Rt(5),RU=Rt(-6),RF=Rt(-5),ar=o.arms;
    if(o.staff){LU=Rt(10);LF=Rt(12)}
    if(o.spear){RU=Rt(-10);RF=Rt(-12)}
    if(ar==='wave'){RU=A('waveU',.9);RF=A('waveF',.9)}
    else if(ar==='cheer'){LU=A('cheerLU',.5);LF=A('cheerLF',.5);RU=A('cheerRU',.5);RF=A('cheerRF',.5)}
    else if(ar==='horn'){RU=Rt(-150);RF=Rt(-136)}
    else if(ar==='lup'){LU=A('cheerLU',.5);LF=A('cheerLF',.5)}
    else if(ar==='bend'){RU=Rt(-30);RF=Rt(-50)}
    else if(ar==='reach'){RU=A('reachU',1.6);RF=Rt(-6)}
    else if(ar==='hammer'){RU=A('hammerU',.55);RF=Rt(-40)}
    else if(ar==='pray'){LU=Rt(15);LF=Rt(-121);RU=Rt(-15);RF=Rt(121)}
    else if(ar==='point'){RU=Rt(-95);RF=Rt(-8)}
    if(o.walk){
      var wk='animation-duration:.84s;animation-timing-function:ease-in-out;animation-iteration-count:'+it+';animation-delay:'+dl+'s;';
      if(!o.staff)LU='animation-name:swingA;'+wk;
      if(ar==='down')RU='animation-name:swingB;'+wk;
    }
    var long=o.sleeves==='long';
    var slingSvg='';
    if(o.sling==='swing')slingSvg='<g transform="translate(0 37)"><g class="slingspin"><path d="M0 0 L0 24" stroke="#d9bd86" stroke-width="1.4"/><ellipse cx="0" cy="25" rx="3.2" ry="2.2" fill="#7a4d22"/></g></g>';
    else if(o.sling)slingSvg='<g transform="translate(0 37)"><path d="M0 0 Q2 10 1 20" stroke="#d9bd86" stroke-width="1.4" fill="none"/><ellipse cx="1" cy="21" rx="3.2" ry="2.2" fill="#7a4d22"/></g>';
    var toolSvg=o.tool?'<g transform="translate(0 37)"><rect x="-1.2" y="-2" width="2.4" height="17" rx="1" fill="#6b4630"/><rect x="-6" y="-5" width="12" height="6" rx="1.5" fill="#6a6a70"/></g>':'';
    function arm(side,U,F){
      var up='M-6.4 -3.5 Q-8.2 13 -6 28 L6 28 Q8.2 13 6.4 -3.5 Q0 -7.5 -6.4 -3.5Z';
      var fo=long?'M-6 0 Q-7.4 13 -6.4 27 L6.4 27 Q7.4 13 6 0Z':'M-4.2 0 Q-5 13 -3.8 26 L3.8 26 Q5 13 4.2 0Z';
      var s='<g transform="translate('+(side*21)+' -125)"><g style="'+U+'"><path d="'+up+'" fill="'+rb+'"/><path d="'+up+'" fill="url(#robeShade)"/>';
      s+='<g transform="translate(0 28)"><g style="'+F+'"><path d="'+fo+'" fill="'+(long?rb:sk)+'"/>'+(long?'<path d="'+fo+'" fill="url(#robeShade)"/>':'');
      s+='<path d="M-3.8 25 Q-5.4 32 -3.4 37 Q0 39 3.4 37 Q5.4 32 3.8 25Z" fill="'+sk+'"/><ellipse cx="'+(side>0?-4.4:4.4)+'" cy="29" rx="1.6" ry="3.3" fill="'+sk+'"/>'+(side>0?slingSvg+toolSvg:'')+'</g></g></g></g>';
      return s;
    }
    var s='<ellipse cx="0" cy="2" rx="26" ry="5" fill="rgba(40,20,0,.2)"/>';
    if(o.wings){s+='<g class="angelF" style="animation-delay:-.4s"><path d="M-8 -126 Q-70 -170 -92 -100 Q-80 -110 -70 -96 Q-62 -100 -52 -84 Q-40 -100 -10 -96Z" fill="#fffdf4" stroke="rgba(255,230,160,.8)" stroke-width="1.6"/><path d="M8 -126 Q70 -170 92 -100 Q80 -110 70 -96 Q62 -100 52 -84 Q40 -100 10 -96Z" fill="#fffdf4" stroke="rgba(255,230,160,.8)" stroke-width="1.6"/></g>'}
    if(o.staff)s+='<rect x="-39.5" y="-166" width="5" height="168" rx="2.5" fill="url(#staffG)"/><circle cx="-37" cy="-168" r="4.5" fill="#7a4d22"/>';
    // legs and sandals
    var fa=o.walk?'animation:step .84s linear '+dl+'s '+it:'',fb=o.walk?'animation:step .84s linear '+(dl-.42)+'s '+it:'';
    var lgy=o.short?-46:-16,lgh=o.short?44:14;

    at(250,448,1.7,mix(MARY,{arms:'pray',mood:'happy',cls:'breath'}))+at(560,448,1.6,mix(JOSE,{arms:'pray',cls:'breath',d:-.4}))+
    '<g class="walkRt" style="--fx:-420px;--tx:0px;--wd:6s">'+at(330,456,1.5,mix(shep(0),{walk:true,cls:'bob'}))+at(420,458,1.4,mix(shep(1),{walk:true,cls:'bob',d:-.2}))+at(500,456,1.45,mix(shep(2),{walk:true,cls:'bob',d:-.4}))+'</g>';
  $('g9').innerHTML+='';

  /* ---------- scene 10: the magi ---------- */
  var g10='';
  g10+='<g class="walkRt" style="--fx:-120px;--tx:360px;--wd:16s">'+at(120,454,1.6,mix(MAGI[0],{walk:true,cls:'bob'}))+at(230,456,1.6,mix(MAGI[1],{walk:true,cls:'bob',d:-.3}))+at(340,454,1.6,mix(MAGI[2],{walk:true,cls:'bob',d:-.6}))+'</g>';
  $('g10').innerHTML=g10;
  $('h10').innerHTML='<g class="lbD"><text class="cz" x="44" y="112" font-size="44" fill="#f6e7bd" stroke="rgba(25,12,45,.7)" stroke-width="8" paint-order="stroke" style="letter-spacing:.08em">LOS MAGOS DE ORIENTE</text><path d="M46 126 H520" stroke="#e0b84a" stroke-width="2.5"/></g>';

  /* ---------- scene 11: gifts ---------- */
  $('g11').innerHTML=
    sheep(670,456,1.1,0)+sc(110,452,1.0,0,donkey())+
    '<g transform="translate(400 440) scale(1.7)">'+manger(true)+'</g>'+
    at(240,450,1.7,mix(MARY,{arms:'pray',mood:'happy',cls:'breath'}))+at(580,450,1.6,mix(JOSE,{arms:'pray',cls:'breath',d:-.4}))+
    at(120,456,1.55,mix(MAGI[0],{arms:'point',cls:'breath'}))+at(700,458,1.5,mix(MAGI[1],{cls:'breath',d:-.4,flip:1}))+at(780,456,1.4,mix(MAGI[2],{cls:'breath',d:-.8,flip:1}))+
    '<g class="popb" style="animation-delay:8s">'+gift(0,330,450)+'</g><g class="popb" style="animation-delay:9.2s">'+gift(1,380,452)+'</g><g class="popb" style="animation-delay:10.4s">'+gift(2,440,450)+'</g>'+
    '<g style="animation:fadein 1.5s .4s both">'+bigStar(400,36,.5,0)+'</g>';
  $('h11').innerHTML='<g class="popb" style="animation-delay:8s"><text class="cz" x="400" y="110" text-anchor="middle" font-size="34" fill="url(#goldT)" stroke="rgba(25,12,45,.8)" stroke-width="7" paint-order="stroke">ORO · INCIENSO · MIRRA</text></g>';

  /* ---------- scene 12: the end ---------- */
  $('g12').innerHTML=
    sheep(130,454,1.2,0)+sheep(740,456,1.1,.9,1)+
    at(320,446,1.9,mix(MARY,{arms:'wave',cls:'breath'}))+at(470,448,1.8,mix(JOSE,{arms:'wave',cls:'breath',d:-.5}))+bigStar(400,90,.6,0);
  $('h12').innerHTML='<g class="popc" style="animation-delay:1.6s;transform-origin:400px 190px"><text class="cz" x="400" y="224" text-anchor="middle" font-size="96" fill="url(#goldT)" stroke="rgba(25,12,45,.7)" stroke-width="9" stroke-linejoin="round" paint-order="stroke" style="letter-spacing:.16em">FIN</text></g>';

  /* ---------- player engine ---------- */
  var stage=$('stage'),capText=$('capText'),playBtn=$('play'),segsEl=$('segs'),timeEl=$('time'),endcard=$('endcard');
  var groups=Array.prototype.map.call(document.querySelectorAll('.sg'),function(el){return {el:el,set:el.dataset.s.split(' ').map(Number)}});
  var idx=0,t=0,vt=0,playing=true,capKey='',lastTs=null,manual=false,fades=[],seen=new WeakSet();

  var ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';
  var ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';

  var segs=S.map(function(s,i){
    var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Escena '+(i+1)+': '+s.n);b.title=s.n;b.innerHTML='<i></i>';
    b.addEventListener('click',function(){seek(i)});segsEl.appendChild(b);return b;
  });

  function fmt(x){x=Math.floor(x);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}

  function restartAnims(el){
    el.getAnimations({subtree:true}).forEach(function(a){
      a.cancel();a.play();
      if(manual){a.pause();a.currentTime=0;seen.add(a)}
    });
  }
  function showScene(i,hard){
    purge=true;
    stage.dataset.scene=i;stage.dataset.beat='0';
    if(hard){fades=[];groups.forEach(function(g){g.el.classList.remove('on','fading')});void stage.getBoundingClientRect()}
    groups.forEach(function(g){
      var want=g.set.indexOf(i)>-1,isOn=g.el.classList.contains('on');
      if(want&&!isOn){g.el.classList.remove('fading');g.el.classList.add('on');restartAnims(g.el)}
      else if(!want&&isOn){g.el.classList.remove('on');g.el.classList.add('fading');fades=fades.filter(function(f){return f.el!==g.el});fades.push({el:g.el,at:vt+.7})}
    });
  }
  function setPaused(p){
    playing=!p;stage.classList.toggle('paused',p);
    playBtn.innerHTML=p?ICON_PLAY:ICON_PAUSE;playBtn.setAttribute('aria-label',p?'Reproducir':'Pausa');
  }
  function seek(i){
    idx=Math.max(0,Math.min(S.length-1,i));t=0;capKey='';endcard.hidden=true;
    stage.classList.toggle('settled',idx>=9);
    showScene(idx,true);setPaused(false);update();
  }
  var beatNow=0;
  function tick(){}
  function update(){
    var sc=S[idx],ci=0;
    sc.c.forEach(function(c,i){if(t>=c[0])ci=i});
    var key=idx+'-'+ci;
    if(key!==capKey){capKey=key;capText.classList.remove('in');void capText.offsetWidth;capText.textContent=sc.c[ci][1];capText.classList.add('in')}
    var bt=0;(sc.b||[]).forEach(function(x){if(t>=x)bt++});
    if(String(bt)!==stage.dataset.beat)stage.dataset.beat=String(bt);
    beatNow=bt;
    tick();
    var done=0;
    segs.forEach(function(el,i){
      var p=i<idx?1:(i===idx?Math.min(1,t/sc.d):0);
      el.style.setProperty('--p',p);
      if(i<idx)done+=S[i].d;
    });
    timeEl.textContent=fmt(done+t)+' / '+fmt(TOTAL);
  }
  function advance(dt){
    t+=dt;vt+=dt;
    fades=fades.filter(function(f){if(vt>=f.at){f.el.classList.remove('fading');return false}return true});
    var sc=S[idx];
    if(t>=sc.d){
      if(idx<S.length-1){idx++;t=0;showScene(idx,false)}
      else{t=sc.d;setPaused(true);endcard.hidden=false}
    }
    update();
  }
  function frame(ts){
    if(lastTs===null)lastTs=ts;
    var dt=Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
    if(!manual&&playing)advance(dt);
    requestAnimationFrame(frame);
  }
  // frame-exact stepping used when capturing the MP4: every CSS animation and transition is driven by hand
  var purge=false;
  function freeze(dt){
    document.getAnimations().forEach(function(a){
      if(purge&&a.animationName&&a.effect&&a.effect.target){
        var nm=getComputedStyle(a.effect.target).animationName.split(',').map(function(x){return x.trim()});
        if(nm.indexOf(a.animationName)<0){a.cancel();return}
      }
      if(!seen.has(a)){seen.add(a);a.pause();a.currentTime=0}
      else a.currentTime=(+a.currentTime||0)+dt*1000;
    });
    purge=false;
  }

  playBtn.addEventListener('click',function(){
    if(!endcard.hidden){seek(0);return}
    setPaused(playing);
  });
  $('replay').addEventListener('click',function(){seek(0)});
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
    if(e.key===' '||e.key==='k'){e.preventDefault();if(!endcard.hidden)seek(0);else setPaused(playing)}
    else if(e.key==='ArrowRight')seek(idx+1);
    else if(e.key==='ArrowLeft')seek(idx-1);
  });

  window.__story={
    seek:seek,
    pause:function(){setPaused(true)},
    manual:function(){manual=true;seek(0);freeze(0)},
    step:function(dt){advance(dt);freeze(dt)},
    state:function(){return {idx:idx,t:t}}
  };
  showScene(0,true);setPaused(false);update();
  requestAnimationFrame(frame);
})();
</script>
