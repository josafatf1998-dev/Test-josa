<title>Joshua and the Walls of Jericho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
@property --sky1{syntax:'<color>';inherits:true;initial-value:#8fd8ff}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#e9f8ff}

/* Layout: a centered 16:9 cinematic stage, a cream caption strip under it, and a slim control bar with one segment per scene. */
:root{
  --ink:#1b1f4b;
  --ink-2:#262b66;
  --paper:#fff6e0;
  --sun:#ffc43d;
  --rose:#ff6b6b;
  --leaf:#4cb87a;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --lap5:4.5s;
  --lap6:2.8s;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;padding-inline:16px;padding-block:24px 48px;font-size:16px}
.wrap{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{margin:0;font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,2.9rem);line-height:1.05;text-wrap:balance}
.player{background:var(--ink-2);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.screen{position:relative;line-height:0}
#stage{width:100%;height:auto;display:block;aspect-ratio:16/9;--sky1:#8fd8ff;--sky2:#e9f8ff;transition:--sky1 1.6s,--sky2 1.6s;user-select:none}
.caption{background:var(--paper);color:var(--ink);padding:16px 20px;min-height:calc(1.4em*3 + 32px);display:flex;align-items:center}
.caption p{margin:0;font-weight:800;font-size:clamp(1.05rem,1.2rem + .6vw,1.55rem);line-height:1.4;text-wrap:pretty}
.caption p.in{animation:capIn .5s ease-out both}
.controls{display:flex;align-items:center;gap:14px;padding:12px 16px}
#play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--sun);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#play svg{width:22px;height:22px;fill:currentColor}
#play:hover{filter:brightness(1.08)}
.segs{flex:1;min-width:0;display:flex;gap:4px}
.segs button{flex:1;min-width:0;height:30px;padding:11px 0;border:0;background:none;cursor:pointer}
.segs i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.segs i::after{content:'';display:block;height:100%;background:var(--sun);transform-origin:left;transform:scaleX(var(--p,0))}
.segs button:hover i{background:rgba(255,255,255,.32)}
#time{flex:none;font-variant-numeric:tabular-nums;font-weight:800;font-size:.9rem;opacity:.85}
button:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:8px}
.hint{margin:0;font-size:.9rem;opacity:.75;text-wrap:pretty}
#endcard{position:absolute;inset:0;display:grid;place-items:center;background:rgba(27,31,75,.5)}
#endcard[hidden]{display:none}
#replay{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3vw,1.9rem);background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:.55em 1.3em;cursor:pointer;line-height:1.2}
#replay:hover{filter:brightness(1.08)}
@media (max-width:520px){#time{display:none}.controls{gap:10px;padding-inline:12px}.caption{padding:14px 16px}}

/* render mode (used to capture the MP4): stage fills the frame, captions sit on top of the picture */
html.render body{padding:0;overflow:hidden}
html.render .wrap{max-width:none;gap:0}
html.render header,html.render .hint,html.render .controls,html.render #endcard{display:none}
html.render .player{border-radius:0;box-shadow:none;position:relative}
html.render .caption{height:120px;min-height:0;padding:0 28px}
html.render .caption p{font-size:29px}

/* ---- stage scenery ---- */
.sg{display:none}
.sg.on,.sg.fading{display:inline}
.sg.on{animation:fadein .6s both}
.sg.fading{animation:fadeout .6s both}
[data-scene="10"] .sg.fadeout.on{animation:fadeout .9s both}
#stage.paused *{animation-play-state:paused!important}
svg text{font-family:var(--display);font-weight:800}

#sun{transform:translate(650px,90px);transition:transform 2.4s ease}
[data-scene="6"] #sun{transform:translate(650px,122px)}
#sun .rays{animation:sunspin 40s linear infinite}
.cloud{animation:drift 80s linear infinite}

[data-scene="0"]{--sky1:#8fd8ff;--sky2:#e9f8ff}
[data-scene="2"]{--sky1:#ffd98a;--sky2:#fff2cf}
[data-scene="3"]{--sky1:#9fc3dc;--sky2:#e3eef4}
[data-scene="4"]{--sky1:#b9b4e6;--sky2:#f1ecff}
[data-scene="6"]{--sky1:#ff9f7a;--sky2:#ffe2a8}
[data-scene="7"]{--sky1:#ffb347;--sky2:#ffe9a0}
[data-scene="8"]{--sky1:#c9b79a;--sky2:#efe2cc}
[data-scene="10"]{--sky1:#8fd8ff;--sky2:#fff3c9}

#cam{transform-origin:0 0;transition:transform 2.3s cubic-bezier(.45,0,.2,1)}
[data-scene="9"] #cam{transform:translate(400px,228px) scale(3) translate(-360px,-156px)}
[data-scene="7"][data-beat="2"] #shake{animation:shake .12s linear infinite}
[data-scene="8"] #shake{animation:shake2 .1s linear 16}

.bob{animation:bob .42s ease-in-out infinite}
.bob8{animation:bob .42s ease-in-out 8}
.hop{animation:hop .6s ease-in-out infinite}
.breath{animation:breath 3.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.note{animation:noteUp 1.6s ease-out infinite}
.palmtop{transform-origin:0 -100px;animation:sway 4s ease-in-out infinite}
.march5{animation:march var(--lap5) linear infinite}
.march6{animation:march var(--lap6) linear infinite}
.wallrise{animation:rise 1.5s cubic-bezier(.2,.8,.2,1) both}
[data-scene="8"] .blk,[data-scene="9"] .blk,[data-scene="10"] .blk{animation:crumble var(--du) cubic-bezier(.55,0,.9,.55) var(--dl) both}
.blk{transform-box:fill-box;transform-origin:center}
#stage.settled .blk{animation-duration:.01s!important;animation-delay:0s!important}
.peek{animation:peek 1.8s ease-in-out infinite}
[data-scene="8"] .peek,[data-scene="9"] .peek,[data-scene="10"] .peek{display:none}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.3s ease-out infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:dust 3.4s ease-out both}
.popb{transform-box:fill-box;transform-origin:center bottom;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.popc{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.4s ease-in-out infinite}
.beam{animation:pulse 2.6s ease-in-out infinite}
.walkin{animation:walkin 3.2s ease-out both}
.floaty{animation:floaty 3s ease-in infinite}
.rb{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}

.m2a{display:inline}.m2b{display:none}
[data-scene="2"][data-beat="1"] .m2a{display:none}
[data-scene="2"][data-beat="1"] .m2b{display:inline}
.ban,.burst{display:none}
[data-scene="2"][data-beat="1"] .ban{display:inline}
[data-scene="7"][data-beat="1"] .burst,[data-scene="7"][data-beat="2"] .burst{display:inline}
.crash{animation:crashA 3s both}

@keyframes capIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.012)}}
@keyframes waveU{0%,100%{transform:rotate(-140deg)}50%{transform:rotate(-158deg)}}
@keyframes waveF{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-52deg)}}
@keyframes cheerLU{0%,100%{transform:rotate(146deg)}50%{transform:rotate(164deg)}}
@keyframes cheerLF{0%,100%{transform:rotate(10deg)}50%{transform:rotate(32deg)}}
@keyframes cheerRU{0%,100%{transform:rotate(-146deg)}50%{transform:rotate(-164deg)}}
@keyframes cheerRF{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-32deg)}}
@keyframes swingA{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes swingB{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes step{0%{transform:translate(5px,0)}25%{transform:translate(0,-3px)}50%{transform:translate(-5px,0)}100%{transform:translate(5px,0)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1000px)}}
@keyframes sunspin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-160px);opacity:0}60%{transform:translateY(12px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes march{from{transform:translateX(-40px)}to{transform:translateX(1320px)}}
@keyframes rise{from{transform:translateY(170px)}to{transform:translateY(0)}}
@keyframes crumble{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,-1px)}}
@keyframes shake2{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}}
@keyframes ring{0%{transform:scale(.3);opacity:.95}100%{transform:scale(3.4);opacity:0}}
@keyframes noteUp{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(10px,-42px);opacity:0}}
@keyframes dust{0%{transform:scale(.2);opacity:0}20%{opacity:.95}100%{transform:scale(2.8) translateY(-14px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.25);opacity:1}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes peek{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes walkin{from{transform:translateX(-360px)}to{transform:translateX(0)}}
@keyframes floaty{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes crashA{0%{transform:scale(0);opacity:1}12%{transform:scale(1.25)}20%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes spark{0%{transform:translate(0,0) scale(1)}50%{transform:translate(190px,-80px) scale(1.5)}100%{transform:translate(379px,27px) scale(1)}}
@keyframes sparkOut{0%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){#shake,.cloud,#sun .rays{animation:none!important}}
</style>

<script>
(function(){
  if(location.hash==='#render')document.documentElement.classList.add('render');

  /* ---------- story script ---------- */
  var S=[
    {n:'Title',d:8,c:[[0,'A Bible story for kids: Joshua and the Walls of Jericho.']]},
    {n:'Moses and Joshua',d:16,c:[[0,"Long ago, God's people, the Israelites, were led by a wise man named Moses."],[8,'When Moses grew old, God chose a new leader. His name was Joshua!']]},
    {n:'Be courageous',d:16,b:[6],c:[[0,'Joshua felt a little nervous. It was a very big job!'],[6,'But God told him, “Be strong and courageous! Do not be afraid. I will be with you wherever you go.”']]},
    {n:'Jericho',d:16,c:[[0,'God had promised his people a new home. But a big city named Jericho stood in the way.'],[8,'Jericho had tall, thick walls, and its gates were shut tight. How could the Israelites get in?']]},
    {n:"God's plan",d:16,c:[[0,'God had a surprising plan! He told Joshua, “March around the city once a day for six days.”'],[6.5,'“On the seventh day, march around seven times. Seven priests will blow trumpets made of rams’ horns.”'],[11.5,'And the people had to stay very quiet until it was time to shout.']]},
    {n:'Marching',d:27,c:[[0,"So Joshua and the Israelites marched around Jericho. The priests carried God’s special golden box, the Ark, and blew their horns."],[9,'Nobody said a word. They marched around once, and then went back to camp.'],[18,'Day after day, for six days. The people of Jericho watched from their walls and wondered what was going on!']]},
    {n:'The seventh day',d:20,c:[[0,'On the seventh day, they got up at sunrise. This time they marched around the city not once, but seven times!'],[10,'Lap after lap, the priests kept blowing their horns.'],[16.8,'Now for the very last lap!']]},

    '<g class="popb" style="animation-delay:8.4s"><rect x="480" y="168" width="180" height="44" rx="22" fill="#ffd23f" stroke="#1b1f4b" stroke-width="4"/><text x="570" y="200" text-anchor="middle" font-size="30" fill="#1b1f4b">Joshua</text></g>';

  /* ---------- scene 2: be strong and courageous ---------- */
  $('g2').innerHTML=
    '<g class="m2a">'+at(400,444,2.3,mix(JOSH,{staff:1,mood:'worry',cls:'breath'}))+'</g>'+
    '<g class="m2b"><polygon class="beam" points="340,0 460,0 560,440 240,440" fill="url(#beamG)"/>'+at(400,444,2.3,mix(JOSH,{staff:1,mood:'happy',arms:'wave',cls:'breath'}))+'</g>';
  $('h2').innerHTML=
    '<g class="ban"><g class="popc" style="transform-origin:400px 70px"><rect x="90" y="28" width="620" height="84" rx="42" fill="#fff6e0" stroke="#e0a82e" stroke-width="6"/><text x="400" y="86" text-anchor="middle" font-size="46" fill="#1b1f4b">Be strong and courageous!</text></g>'+
    '<polygon class="twinkle" points="'+star(84,40,4,18,6)+'" fill="#ffd23f" stroke="#fff" stroke-width="2"/><polygon class="twinkle" points="'+star(718,104,4,15,5)+'" fill="#ffd23f" stroke="#fff" stroke-width="2" style="animation-delay:.5s"/><polygon class="twinkle" points="'+star(712,30,4,12,4)+'" fill="#fff" stroke="#ffd23f" stroke-width="2" style="animation-delay:.9s"/></g>';

  /* ---------- scene 3: Jericho looks huge ---------- */
  var crowd3='',xs3=[70,125,180,235,290];
  xs3.forEach(function(px,i){crowd3+=at(px,408,1,mix(folk(i),{mood:'worry',walk:4,cls:'bob8',d:-(i*.08)}))});
  $('g3').innerHTML='<g class="walkin">'+crowd3+'</g>'+at(375,418,1.3,mix(JOSH,{staff:1,mood:'open',cls:'breath'}));
  var q='';xs3.forEach(function(px,i){
    q+='<g class="popc" style="animation-delay:'+(3.4+i*.3).toFixed(1)+'s"><text x="'+px+'" y="288" text-anchor="middle" font-size="40" fill="#fff" stroke="#1b1f4b" stroke-width="7" stroke-linejoin="round" paint-order="stroke">?</text></g>';
  });
  $('h3').innerHTML=q;

  /* ---------- scene 4: God's plan ---------- */
  var horns='';for(var hh=0;hh<7;hh++){horns+='<g transform="translate('+(392+hh*36)+' 270) scale(.9)"><path d="M0 0 Q18 -2 24 -18 Q26 -26 20 -26 Q18 -26 17 -22 Q12 -9 0 -8Z" fill="#c98b3c" stroke="#8a5a1f" stroke-width="2"/></g>'}
  var d6='',d7='';for(var a=0;a<6;a++){d6+='<circle cx="'+(552+a*32)+'" cy="86" r="11" fill="#4cb87a"/>'}
  for(var b=0;b<7;b++){d7+='<circle cx="'+(552+b*29)+'" cy="178" r="11" fill="#ff9f40"/>'}
  $('g4').innerHTML=
    '<polygon class="beam" points="90,0 210,0 270,440 30,440" fill="url(#beamG)"/>'+
    at(150,430,1.9,mix(JOSH,{staff:1,mood:'open',cls:'breath'}));
  $('h4').innerHTML=
    '<circle cx="232" cy="236" r="8" fill="#fff" stroke="#cfd4ff" stroke-width="3"/><circle cx="282" cy="256" r="13" fill="#fff" stroke="#cfd4ff" stroke-width="3"/>'+
    '<rect x="340" y="26" width="440" height="296" rx="54" fill="#fff" stroke="#cfd4ff" stroke-width="5" class="popc" style="animation-delay:.3s;transform-origin:560px 174px"/>'+
    '<g class="popc" style="animation-delay:1s"><text x="372" y="100" font-size="42" fill="#1b1f4b">6 days</text>'+d6+'<text x="372" y="134" font-size="26" fill="#5b6288">1 lap around the city a day</text></g>'+
    '<g class="popc" style="animation-delay:6.5s"><text x="372" y="192" font-size="42" fill="#e0443e">Day 7</text>'+d7+'<text x="372" y="226" font-size="26" fill="#5b6288">7 laps, then a big shout!</text></g>'+
    '<g class="popc" style="animation-delay:11.5s">'+horns+'<text x="392" y="308" font-size="26" fill="#5b6288">7 priests, 7 horns</text></g>';

  /* ---------- scenes 5 and 6: the march ---------- */
  function row(){
    var s='',i=0;
    s+=at(0,0,1,mix(JOSH,{staff:1,walk:true,cls:'bob',d:0}));
    [-36,-72].forEach(function(x){i++;s+=at(x,0,1,mix(folk(i),{walk:true,cls:'bob',d:-(i*.09)}))});
    for(var k=0;k<7;k++){i++;s+=at(-108-36*k,0,1,mix(PRIEST,{skin:SKINS[i%4],arms:'horn',walk:true,cls:'bob',d:-(i*.07)}))}
    s+=at(-380,0,1,mix(PRIEST,{walk:true,cls:'bob',d:-.2}));
    s+=at(-440,0,1,mix(PRIEST,{walk:true,cls:'bob',d:-.3,skin:SKINS[2]}));
    s+='<g transform="translate(-410 -74)"><g class="bob" style="animation-delay:-.25s">'+ark()+'</g></g>';
    [-490,-526,-562,-598].forEach(function(x){i++;s+=at(x,0,1,mix(folk(i),{walk:true,cls:'bob',d:-(i*.06)}))});
    return s;
  }
  var rowSvg=row();
  $('g5').innerHTML='<g transform="translate(0 414)"><g class="march5"><g transform="scale(.82)">'+rowSvg+'</g></g></g>';
  $('g6').innerHTML='<g transform="translate(0 414)"><g class="march6"><g transform="scale(.82)">'+rowSvg+'</g></g></g>';

  var dots='';for(var dd=0;dd<7;dd++){dots+='<circle class="dot" cx="'+(46+dd*40)+'" cy="92" r="10" fill="#d9dcf0"/>'}
  $('dots').innerHTML=dots;
  var dotEls=$('dots').children,dayLbl=$('dayLbl');

  /* ---------- scene 7 and 8: the shout ---------- */
  var g7='';
  [40,110,180,250,340,460,550,620,690,760].forEach(function(px,i){
    g7+=at(px,400,.95,mix(folk(i),{arms:'cheer',cd:5,d:-(i*.08),cls:'hop'}));
  });
  var pxs=[95,170,245,320,480,555,630],rings='';
  pxs.forEach(function(px,i){
    g7+=at(px,434,1.15,mix(PRIEST,{skin:SKINS[i%4],arms:'horn',cls:'breath',d:-(i*.2)}));
    rings+='<circle class="ring" cx="'+(px+20)+'" cy="'+(434-118)+'" r="10" fill="none" stroke="#fff" stroke-width="3" style="animation-delay:'+(i*.18).toFixed(2)+'s"/>';
  });
  g7+=at(400,438,1.5,mix(JOSH,{staff:1,arms:'cheer',cd:5,mood:'open',cls:'hop'}));
  $('g7').innerHTML=g7+rings;
  $('h7').innerHTML='<g class="burst"><g class="popc" style="transform-origin:400px 112px"><polygon points="'+star(400,112,14,100,70)+'" fill="#ffd23f" stroke="#e0443e" stroke-width="6" stroke-linejoin="round"/><text x="400" y="132" text-anchor="middle" font-size="58" fill="#e0443e" stroke="#fff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">SHOUT!</text></g></g>';
  $('h8').innerHTML='<g class="crash" style="transform-origin:400px 100px;transform-box:view-box"><text x="400" y="130" text-anchor="middle" font-size="104" fill="#ff6b6b" stroke="#1b1f4b" stroke-width="12" stroke-linejoin="round" paint-order="stroke">CRASH!</text></g>';

  /* ---------- scene 9: Rahab ---------- */
  var hearts='';[[322,122,0],[360,104,.9],[398,122,1.8]].forEach(function(h){
    hearts+='<g transform="translate('+h[0]+' '+h[1]+') scale(.32)"><g class="floaty" style="animation-delay:'+h[2]+'s"><path d="M0 0 C-10 -12 -26 0 0 22 C26 0 10 -12 0 0Z" fill="#ff4d6d"/></g></g>';
  });
  var sparks='';[[308,150,0],[412,146,.4],[330,196,.8],[392,200,1.2]].forEach(function(p){
    sparks+='<polygon class="twinkle" points="'+star(p[0],p[1],4,7,2.4)+'" fill="#ffd23f" style="animation-delay:'+p[2]+'s"/>';
  });
  var RAHAB={robe:'#a8403f',female:1,wrap:'#d8b98a',hair:'#241610',skin:SKINS[1],mantle:'#d9c9a3'};
  $('g9').innerHTML=
    '<circle cx="360" cy="152" r="70" fill="url(#glowG)" opacity=".7"/>'+
    '<path d="M338 172 V150 Q338 134 360 134 Q382 134 382 150 V172Z" fill="#ffe9b0"/>'+
    '<g clip-path="url(#winclip)">'+
      at(343,224,.72,mix(folk(1),{kid:1,arms:'wave',d:-.3}))+at(377,224,.72,mix(folk(4),{kid:1,arms:'wave',d:-.5}))+
      at(360,236,.9,mix(RAHAB,{arms:'wave',mood:'happy'}))+'</g>'+
    '<rect x="333" y="172" width="54" height="6" rx="2" fill="#c99a5b"/>'+
    '<path d="M360 178 C351 205 369 228 358 254 S365 296 360 338" fill="none" stroke="#ff4d5e" stroke-width="5" stroke-linecap="round"/>'+hearts+sparks;

  /* ---------- scene 10: finale ---------- */
  var f='';
  var cast=[
    [115,1.2,folk(0)],
    [188,.9,mix(folk(3),{kid:1})],
    [255,1.2,mix(PRIEST,{horn:1,arms:'horn'})],
    [325,1.2,mix(RAHAB,{})],
    [400,1.6,mix(JOSH,{staff:1})],
    [478,.9,mix(folk(6),{kid:1})],
    [548,1.2,folk(7)],
    [618,1.2,mix(PRIEST,{horn:1,arms:'horn',skin:SKINS[3]})],
    [690,1.05,folk(5)]
  ];
  cast.forEach(function(c,i){f+=at(c[0],424,c[1],mix({arms:(c[2].horn?'horn':'cheer'),cls:'hop',d:-(i*.13)},c[2],c[2].horn?{arms:'horn'}:{}))});
  var rb='',cols=['#ff4d4d','#ff9f40','#ffd23f','#6bd36b','#4cc9f0','#5b6cf0','#a45cf0'];
  cols.forEach(function(cl,i){var rd=300-i*12;rb+='<path class="rb" pathLength="1" d="M'+(400-rd)+' 350 A'+rd+' '+rd+' 0 0 1 '+(400+rd)+' 350" fill="none" stroke="'+cl+'" stroke-width="12" style="animation-delay:'+(i*.12).toFixed(2)+'s"/>'});
  $('g10').innerHTML=rb+f;
  var fh='';[[200,230,0],[600,240,1],[300,200,2],[500,205,.5]].forEach(function(h){
    fh+='<g transform="translate('+h[0]+' '+h[1]+') scale(.7)"><g class="floaty" style="animation-delay:'+h[2]+'s"><path d="M0 0 C-10 -12 -26 0 0 22 C26 0 10 -12 0 0Z" fill="#ff4d6d"/></g></g>';
  });
  $('h10').innerHTML='<g class="popc" style="animation-delay:1.6s;transform-origin:400px 250px"><text x="400" y="248" text-anchor="middle" font-size="76" fill="#fff" stroke="#1b1f4b" stroke-width="12" stroke-linejoin="round" paint-order="stroke">The End</text></g>'+fh;

  /* ---------- player engine ---------- */
  var stage=$('stage'),capText=$('capText'),playBtn=$('play'),segsEl=$('segs'),timeEl=$('time'),endcard=$('endcard');
  var groups=Array.prototype.map.call(document.querySelectorAll('.sg'),function(el){return {el:el,set:el.dataset.s.split(' ').map(Number)}});
  var idx=0,t=0,vt=0,playing=true,capKey='',lastTs=null,manual=false,fades=[],seen=new WeakSet();

  var ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';
  var ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';

  var segs=S.map(function(s,i){
    var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Scene '+(i+1)+': '+s.n);b.title=s.n;b.innerHTML='<i></i>';
    b.addEventListener('click',function(){seek(i)});segsEl.appendChild(b);return b;
  });

  function fmt(x){x=Math.floor(x);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}

  function showScene(i,hard){
    stage.dataset.scene=i;stage.dataset.beat='0';
    if(hard){fades=[];groups.forEach(function(g){g.el.classList.remove('on','fading')});void stage.getBoundingClientRect()}
    groups.forEach(function(g){
      var want=g.set.indexOf(i)>-1,isOn=g.el.classList.contains('on');
      if(want&&!isOn){g.el.classList.remove('fading');g.el.classList.add('on')}
      else if(!want&&isOn){g.el.classList.remove('on');g.el.classList.add('fading');fades=fades.filter(function(f){return f.el!==g.el});fades.push({el:g.el,at:vt+.7})}
    });
  }
  function setPaused(p){
    playing=!p;stage.classList.toggle('paused',p);
    playBtn.innerHTML=p?ICON_PLAY:ICON_PAUSE;playBtn.setAttribute('aria-label',p?'Play':'Pause');
  }
  function seek(i){
    idx=Math.max(0,Math.min(S.length-1,i));t=0;capKey='';endcard.hidden=true;
    stage.classList.toggle('settled',idx>=9);
    showScene(idx,true);setPaused(false);update();
  }
  function tick(){
    if(idx===5){
      var day=Math.min(6,Math.floor(t/4.5)+1);
      dayLbl.textContent='Day '+day+' of 6';
      for(var i=0;i<7;i++){dotEls[i].style.display=i<6?'':'none';dotEls[i].setAttribute('fill',i<day?'#4cb87a':'#d9dcf0')}
    }else if(idx===6){
      var lap=Math.min(7,Math.floor(t/2.8)+1);
      dayLbl.textContent='Day 7: lap '+lap+' of 7';
      for(var j=0;j<7;j++){dotEls[j].style.display='';dotEls[j].setAttribute('fill',j<lap?'#ff9f40':'#d9dcf0')}
    }
  }
  function update(){
    var sc=S[idx],ci=0;
    sc.c.forEach(function(c,i){if(t>=c[0])ci=i});
    var key=idx+'-'+ci;
    if(key!==capKey){capKey=key;capText.classList.remove('in');void capText.offsetWidth;capText.textContent=sc.c[ci][1];capText.classList.add('in')}
    var bt=0;(sc.b||[]).forEach(function(x){if(t>=x)bt++});
    if(String(bt)!==stage.dataset.beat)stage.dataset.beat=String(bt);
    tick();
    var done=0;
    segs.forEach(function(el,i){
      var p=i<idx?1:(i===idx?Math.min(1,t/sc.d):0);
      el.style.setProperty('--p',p);
      if(i<idx)done+=S[i].d;
    });
    timeEl.textContent=fmt(done+t)+' / '+fmt(TOTAL);
  }
  function advance(dt){
    t+=dt;vt+=dt;
    fades=fades.filter(function(f){if(vt>=f.at){f.el.classList.remove('fading');return false}return true});
    var sc=S[idx];
    if(t>=sc.d){
      if(idx<S.length-1){idx++;t=0;showScene(idx,false)}
      else{t=sc.d;setPaused(true);endcard.hidden=false}
    }
    update();
  }
  function frame(ts){
    if(lastTs===null)lastTs=ts;
    var dt=Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
    if(!manual&&playing)advance(dt);
    requestAnimationFrame(frame);
  }
  // frame-exact stepping used when capturing the MP4: every CSS animation and transition is driven by hand
  function freeze(dt){
    document.getAnimations().forEach(function(a){
      if(!seen.has(a)){seen.add(a);a.pause();a.currentTime=0}
      else a.currentTime=(+a.currentTime||0)+dt*1000;
    });
  }

  playBtn.addEventListener('click',function(){
    if(!endcard.hidden){seek(0);return}
    setPaused(playing);
  });
  $('replay').addEventListener('click',function(){seek(0)});
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
    if(e.key===' '||e.key==='k'){e.preventDefault();if(!endcard.hidden)seek(0);else setPaused(playing)}
    else if(e.key==='ArrowRight')seek(idx+1);
    else if(e.key==='ArrowLeft')seek(idx-1);
  });

  window.__story={
    seek:seek,
    pause:function(){setPaused(true)},
    manual:function(){manual=true;seek(0);freeze(0)},
    step:function(dt){advance(dt);freeze(dt)},
    state:function(){return {idx:idx,t:t}}
  };
  showScene(0,true);setPaused(false);update();
  requestAnimationFrame(frame);
})();
</script>
