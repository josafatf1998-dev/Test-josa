<title>Joshua and the Walls of Jericho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
@property --sky1{syntax:'<color>';inherits:true;initial-value:#8fd8ff}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#e9f8ff}

/* Layout: a centered 16:9 cartoon stage, a cream caption strip under it, and a slim control bar with one segment per scene. */
:root{
  --ink:#1b1f4b;
  --ink-2:#262b66;
  --paper:#fff6e0;
  --sun:#ffc43d;
  --rose:#ff6b6b;
  --leaf:#4cb87a;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --lap5:4.5s;
  --lap6:2.8s;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;padding-inline:16px;padding-block:24px 48px;font-size:16px}
.wrap{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{margin:0;font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,2.9rem);line-height:1.05;text-wrap:balance}
.player{background:var(--ink-2);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.screen{position:relative;line-height:0}
#stage{width:100%;height:auto;display:block;aspect-ratio:16/9;--sky1:#8fd8ff;--sky2:#e9f8ff;transition:--sky1 1.6s,--sky2 1.6s;user-select:none}
.caption{background:var(--paper);color:var(--ink);padding:16px 20px;min-height:calc(1.4em*3 + 32px);display:flex;align-items:center}
.caption p{margin:0;font-weight:800;font-size:clamp(1.05rem,1.2rem + .6vw,1.55rem);line-height:1.4;text-wrap:pretty}
.caption p.in{animation:capIn .5s ease-out both}
.controls{display:flex;align-items:center;gap:14px;padding:12px 16px}
#play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--sun);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#play svg{width:22px;height:22px;fill:currentColor}
#play:hover{filter:brightness(1.08)}
.segs{flex:1;min-width:0;display:flex;gap:4px}
.segs button{flex:1;min-width:0;height:30px;padding:11px 0;border:0;background:none;cursor:pointer}
.segs i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.segs i::after{content:'';display:block;height:100%;background:var(--sun);transform-origin:left;transform:scaleX(var(--p,0))}
.segs button:hover i{background:rgba(255,255,255,.32)}
#time{flex:none;font-variant-numeric:tabular-nums;font-weight:800;font-size:.9rem;opacity:.85}
button:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:8px}
.hint{margin:0;font-size:.9rem;opacity:.75;text-wrap:pretty}
#endcard{position:absolute;inset:0;display:grid;place-items:center;background:rgba(27,31,75,.5)}
#endcard[hidden]{display:none}
#replay{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3vw,1.9rem);background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:.55em 1.3em;cursor:pointer;line-height:1.2}
#replay:hover{filter:brightness(1.08)}
@media (max-width:520px){#time{display:none}.controls{gap:10px;padding-inline:12px}.caption{padding:14px 16px}}

/* ---- stage scenery ---- */
.sg{display:none}
.sg.on,.sg.fading{display:inline}
.sg.on{animation:fadein .6s both}
.sg.fading{animation:fadeout .6s both}
[data-scene="10"] .sg.fadeout.on{animation:fadeout .9s both}
#stage.paused *{animation-play-state:paused!important}
svg text{font-family:var(--display);font-weight:800}

#sun{transform:translate(650px,90px);transition:transform 2.4s ease}
[data-scene="6"] #sun{transform:translate(650px,122px)}
#sun .rays{animation:sunspin 40s linear infinite}
.cloud{animation:drift 80s linear infinite}

[data-scene="0"]{--sky1:#8fd8ff;--sky2:#e9f8ff}
[data-scene="2"]{--sky1:#ffd98a;--sky2:#fff2cf}
[data-scene="3"]{--sky1:#9fc3dc;--sky2:#e3eef4}
[data-scene="4"]{--sky1:#b9b4e6;--sky2:#f1ecff}
[data-scene="6"]{--sky1:#ff9f7a;--sky2:#ffe2a8}
[data-scene="7"]{--sky1:#ffb347;--sky2:#ffe9a0}
[data-scene="8"]{--sky1:#c9b79a;--sky2:#efe2cc}
[data-scene="10"]{--sky1:#8fd8ff;--sky2:#fff3c9}

#cam{transform-origin:0 0;transition:transform 2.3s cubic-bezier(.45,0,.2,1)}
[data-scene="9"] #cam{transform:translate(400px,238px) scale(2.5) translate(-360px,-162px)}
[data-scene="7"][data-beat="2"] #shake{animation:shake .12s linear infinite}
[data-scene="8"] #shake{animation:shake2 .1s linear 16}

.bob{animation:bob .42s ease-in-out infinite}
.bob8{animation:bob .42s ease-in-out 8}
.hop{animation:hop .6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.note{animation:noteUp 1.6s ease-out infinite}
.palmtop{transform-origin:0 -100px;animation:sway 4s ease-in-out infinite}
.march5{animation:march var(--lap5) linear infinite}
.march6{animation:march var(--lap6) linear infinite}
.wallrise{animation:rise 1.5s cubic-bezier(.2,.8,.2,1) both}
[data-scene="8"] .blk,[data-scene="9"] .blk,[data-scene="10"] .blk{animation:crumble var(--du) cubic-bezier(.55,0,.9,.55) var(--dl) both}
#stage.settled .blk{animation-duration:.01s!important;animation-delay:0s!important}
.peek{animation:peek 1.8s ease-in-out infinite}
[data-scene="8"] .peek,[data-scene="9"] .peek,[data-scene="10"] .peek{display:none}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.3s ease-out infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:dust 3.4s ease-out both}
.popb{transform-box:fill-box;transform-origin:center bottom;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.popc{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.4s ease-in-out infinite}
.beam{animation:pulse 2.6s ease-in-out infinite}
.walkin{animation:walkin 3.2s ease-out both}
.floaty{animation:floaty 3s ease-in infinite}
.rb{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}

.m2a{display:inline}.m2b{display:none}
[data-scene="2"][data-beat="1"] .m2a{display:none}
[data-scene="2"][data-beat="1"] .m2b{display:inline}
.ban,.burst{display:none}
[data-scene="2"][data-beat="1"] .ban{display:inline}
[data-scene="7"][data-beat="1"] .burst,[data-scene="7"][data-beat="2"] .burst{display:inline}
.crash{animation:crashA 3s both}

@keyframes capIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes wave{0%,100%{transform:rotate(-135deg)}50%{transform:rotate(-172deg)}}
@keyframes cheerL{0%,100%{transform:rotate(150deg)}50%{transform:rotate(176deg)}}
@keyframes cheerR{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-176deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1000px)}}
@keyframes sunspin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-160px);opacity:0}60%{transform:translateY(12px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes march{from{transform:translateX(-40px)}to{transform:translateX(1295px)}}
@keyframes rise{from{transform:translateY(170px)}to{transform:translateY(0)}}
@keyframes crumble{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,-1px)}}
@keyframes shake2{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}}
@keyframes ring{0%{transform:scale(.3);opacity:.95}100%{transform:scale(3.4);opacity:0}}
@keyframes noteUp{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(10px,-42px);opacity:0}}
@keyframes dust{0%{transform:scale(.2);opacity:0}20%{opacity:.95}100%{transform:scale(2.8) translateY(-14px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.25);opacity:1}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes peek{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes walkin{from{transform:translateX(-360px)}to{transform:translateX(0)}}
@keyframes floaty{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes crashA{0%{transform:scale(0);opacity:1}12%{transform:scale(1.25)}20%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes spark{0%{transform:translate(0,0) scale(1)}50%{transform:translate(185px,-80px) scale(1.5)}100%{transform:translate(372px,18px) scale(1)}}
@keyframes sparkOut{0%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){#shake,.cloud,#sun .rays{animation:none!important}}
</style>

<main class="wrap">
  <header>
    <p class="eyebrow">Bible story for kids · Joshua 1 and 6</p>
    <h1>Joshua and the Walls of Jericho</h1>

  <section class="player" aria-label="Animated story">

          <g fill="#e8c27b"><ellipse cx="120" cy="438" rx="38" ry="5"/><ellipse cx="450" cy="432" rx="52" ry="5"/><ellipse cx="690" cy="440" rx="34" ry="5"/></g>

<script>
(function(){
  /* ---------- story script ---------- */
  var S=[
    {n:'Title',d:8,c:[[0,'A Bible story for kids: Joshua and the Walls of Jericho.']]},
    {n:'Moses and Joshua',d:16,c:[[0,"Long ago, God's people, the Israelites, were led by a wise man named Moses."],[8,'When Moses grew old, God chose a new leader. His name was Joshua!']]},
    {n:'Be courageous',d:16,b:[6],c:[[0,'Joshua felt a little nervous. It was a very big job!'],[6,'But God told him, “Be strong and courageous! Do not be afraid. I will be with you wherever you go.”']]},
    {n:'Jericho',d:16,c:[[0,'God had promised his people a new home. But a big city named Jericho stood in the way.'],[8,'Jericho had tall, thick walls, and its gates were shut tight. How could the Israelites get in?']]},
    {n:"God's plan",d:16,c:[[0,'God had a surprising plan! He told Joshua, “March around the city once a day for six days.”'],[6.5,'“On the seventh day, march around seven times. Seven priests will blow trumpets made of rams’ horns.”'],[11.5,'And the people had to stay very quiet until it was time to shout.']]},
    {n:'Marching',d:27,c:[[0,"So Joshua and the Israelites marched around Jericho. The priests carried God’s special golden box, the Ark, and blew their horns."],[9,'Nobody said a word. They marched around once, and then went back to camp.'],[18,'Day after day, for six days. The people of Jericho watched from their walls and wondered what was going on!']]},
    {n:'The seventh day',d:20,c:[[0,'On the seventh day, they got up at sunrise. This time they marched around the city not once, but seven times!'],[10,'Lap after lap, the priests kept blowing their horns.'],[16.8,'Now for the very last lap!']]},
    {n:'The shout',d:14,b:[5,8],c:[[0,'Then the priests gave one long, loud blast on their horns!'],[5,'And Joshua called out, “Shout! For the Lord has given you the city!”'],[9,'Everyone shouted as loud as they could!']]},
    {n:'Walls fall',d:12,c:[[0,'And then, CRASH! The strong walls of Jericho came tumbling down!'],[6,'God did exactly what he promised. The people marched straight in.']]},
    {n:'Rahab',d:14,c:[[0,'But one family was kept safe. A woman named Rahab had helped two Israelite spies, so she hung a red cord in her window.'],[7.5,'Joshua kept his promise to her, and Rahab and her whole family were saved.']]},
    {n:'The end',d:16,c:[[0,'Joshua learned that when we trust God and do what he says, even when his plan seems strange, amazing things can happen!'],[9,'“Be strong and courageous… for the Lord your God will be with you wherever you go.” Joshua 1:9']]}
  ];
  var TOTAL=S.reduce(function(a,s){return a+s.d},0);

  /* ---------- drawing helpers ---------- */
  var SK=['#f2c39b','#e0a97c','#c58a5c','#8d5a3b'];
  var ROBES=['#e76f51','#2a9d8f','#f4a261','#9b5de5','#e9c46a','#4cc9f0','#ef476f','#06d6a0'];

  function person(o){
    o=Object.assign({robe:'#4a7bd1',skin:SK[0],hair:'#4a2f1f',mood:'happy',arms:'down',cd:0,d:0},o);
    var hc=o.gray?'#dcdce6':o.hair, dl=(o.cd+o.d);
    function arm(side,css){
      return '<g transform="translate('+(side*15)+' -60)"><g style="'+css+'"><rect x="-5" y="-2" width="10" height="27" rx="5" fill="'+o.robe+'"/><circle cx="0" cy="26" r="5.5" fill="'+o.skin+'"/></g></g>';
    }
    function anim(n,dur){return 'animation:'+n+' '+dur+'s ease-in-out '+dl+'s infinite'}
    var L,R;
    if(o.arms==='wave'){L='transform:rotate(10deg)';R=anim('wave',.9)}
    else if(o.arms==='cheer'){L=anim('cheerL',.5);R=anim('cheerR',.5)}
    else{L='transform:rotate(10deg)';R='transform:rotate(-10deg)'}
    var s='';
    if(o.long){s+='<path d="M-14 -88 Q-23 -66 -13 -54 L-7 -70Z" fill="'+hc+'"/><path d="M14 -88 Q23 -66 13 -54 L7 -70Z" fill="'+hc+'"/>'}
    if(o.staff){s+='<rect x="-21" y="-100" width="5" height="100" rx="2.5" fill="#8a5a2b"/><circle cx="-18.5" cy="-102" r="5" fill="#8a5a2b"/>'}
    s+='<g><rect x="-11" y="-20" width="8" height="20" rx="4" fill="#6b4630"/><rect x="3" y="-20" width="8" height="20" rx="4" fill="#6b4630"/><ellipse cx="-8" cy="0" rx="8" ry="4" fill="#4b2f20"/><ellipse cx="8" cy="0" rx="8" ry="4" fill="#4b2f20"/></g>';
    s+='<path d="M-19 -17 Q-23 -60 -11 -66 L11 -66 Q23 -60 19 -17 Q0 -11 -19 -17Z" fill="'+o.robe+'"/>';
    s+='<path d="M-20 -30 Q0 -24 20 -30 L19.5 -35 Q0 -29 -19.5 -35Z" fill="'+(o.sash||'rgba(255,255,255,.55)')+'"/>';
    s+=arm(-1,L)+arm(1,R);
    s+='<circle cx="0" cy="-80" r="14" fill="'+o.skin+'"/>';
    if(o.beard){s+='<path d="M-13 -78 Q-12 -56 0 -55 Q12 -56 13 -78 Q6 -68 0 -68 Q-6 -68 -13 -78Z" fill="'+hc+'"/>'}
    s+='<circle cx="-9" cy="-76" r="3" fill="#ff8f8f" opacity=".45"/><circle cx="9" cy="-76" r="3" fill="#ff8f8f" opacity=".45"/>';

  function fmt(x){x=Math.floor(x);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}

  function showScene(i,hard){
    stage.dataset.scene=i;stage.dataset.beat='0';
    if(hard){groups.forEach(function(g){g.el.classList.remove('on','fading')});void stage.getBoundingClientRect()}
    groups.forEach(function(g){
      var want=g.set.indexOf(i)>-1,isOn=g.el.classList.contains('on');
      if(want&&!isOn){g.el.classList.remove('fading');g.el.classList.add('on')}
      else if(!want&&isOn){g.el.classList.remove('on');g.el.classList.add('fading');clearTimeout(g.el._t);g.el._t=setTimeout(function(){g.el.classList.remove('fading')},700)}
    });
  }
  function setPaused(p){
    playing=!p;stage.classList.toggle('paused',p);
    playBtn.innerHTML=p?ICON_PLAY:ICON_PAUSE;playBtn.setAttribute('aria-label',p?'Play':'Pause');
  }
  function seek(i){
    idx=Math.max(0,Math.min(S.length-1,i));t=0;capKey='';endcard.hidden=true;
    stage.classList.toggle('settled',idx>=9);
    showScene(idx,true);setPaused(false);update();
  }
  function tick(){
    if(idx===5){
      var day=Math.min(6,Math.floor(t/4.5)+1);
      dayLbl.textContent='Day '+day+' of 6';
      for(var i=0;i<7;i++){dotEls[i].style.display=i<6?'':'none';dotEls[i].setAttribute('fill',i<day?'#4cb87a':'#d9dcf0')}
    }else if(idx===6){
      var lap=Math.min(7,Math.floor(t/2.8)+1);
      dayLbl.textContent='Day 7: lap '+lap+' of 7';
      for(var j=0;j<7;j++){dotEls[j].style.display='';dotEls[j].setAttribute('fill',j<lap?'#ff9f40':'#d9dcf0')}
    }
  }
  function update(){
    var sc=S[idx],ci=0;
    sc.c.forEach(function(c,i){if(t>=c[0])ci=i});
    var key=idx+'-'+ci;
    if(key!==capKey){capKey=key;capText.classList.remove('in');void capText.offsetWidth;capText.textContent=sc.c[ci][1];capText.classList.add('in')}
    var bt=0;(sc.b||[]).forEach(function(x){if(t>=x)bt++});
    if(String(bt)!==stage.dataset.beat)stage.dataset.beat=String(bt);
    tick();
    var done=0;
    segs.forEach(function(el,i){
      var p=i<idx?1:(i===idx?Math.min(1,t/sc.d):0);
      el.style.setProperty('--p',p);
      if(i<idx)done+=S[i].d;
    });
    timeEl.textContent=fmt(done+t)+' / '+fmt(TOTAL);
  }
  function frame(ts){
    if(lastTs===null)lastTs=ts;
    var dt=Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
    if(playing){
      t+=dt;
      var sc=S[idx];
      if(t>=sc.d){
        if(idx<S.length-1){idx++;t=0;showScene(idx,false)}
        else{t=sc.d;setPaused(true);endcard.hidden=false}
      }
      update();
    }
    requestAnimationFrame(frame);
  }

  playBtn.addEventListener('click',function(){
    if(!endcard.hidden){seek(0);return}
    setPaused(playing);
  });
  $('replay').addEventListener('click',function(){seek(0)});
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
    if(e.key===' '||e.key==='k'){e.preventDefault();if(!endcard.hidden)seek(0);else setPaused(playing)}
    else if(e.key==='ArrowRight')seek(idx+1);
    else if(e.key==='ArrowLeft')seek(idx-1);
  });

  window.__story={seek:seek,pause:function(){setPaused(true)}};
  showScene(0,true);setPaused(false);update();
  requestAnimationFrame(frame);
})();
</script>
