/* Layout: a centered 16:9 cinematic stage, a cream caption strip under it, and a slim control bar with one segment per scene. */
:root{
  --ink:#1b1f4b;
  --ink-2:#262b66;
  --paper:#fff6e0;
  --sun:#ffc43d;
  --rose:#ff6b6b;
  --leaf:#4cb87a;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --lap5:4.5s;
  --lap6:2.8s;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;padding-inline:16px;padding-block:24px 48px;font-size:16px}
.wrap{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{margin:0;font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,2.9rem);line-height:1.05;text-wrap:balance}
.player{background:var(--ink-2);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.screen{position:relative;line-height:0;aspect-ratio:2.35/1;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;height:auto;display:block;aspect-ratio:16/9;transition:--sky1 1.6s,--sky2 1.6s,--grade 1.6s;user-select:none}
.caption{background:#07070c;color:#fff;padding:14px 22px;min-height:calc(1.4em*2 + 28px);display:flex;align-items:center;justify-content:center;text-align:center}
.caption p{margin:0;font-weight:800;font-size:clamp(1.05rem,1.2rem + .6vw,1.55rem);line-height:1.4;text-wrap:pretty}
.caption p.in{animation:capIn .5s ease-out both}
.controls{display:flex;align-items:center;gap:14px;padding:12px 16px}
#play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--sun);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#play svg{width:22px;height:22px;fill:currentColor}
#play:hover{filter:brightness(1.08)}
.segs{flex:1;min-width:0;display:flex;gap:4px}
.segs button{flex:1;min-width:0;height:30px;padding:11px 0;border:0;background:none;cursor:pointer}
.segs i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.segs i::after{content:'';display:block;height:100%;background:var(--sun);transform-origin:left;transform:scaleX(var(--p,0))}
.segs button:hover i{background:rgba(255,255,255,.32)}
#time{flex:none;font-variant-numeric:tabular-nums;font-weight:800;font-size:.9rem;opacity:.85}
button:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:8px}
.hint{margin:0;font-size:.9rem;opacity:.75;text-wrap:pretty}
#endcard{position:absolute;inset:0;display:grid;place-items:center;background:rgba(27,31,75,.5)}
#endcard[hidden]{display:none}
#replay{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3vw,1.9rem);background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:.55em 1.3em;cursor:pointer;line-height:1.2}
#replay:hover{filter:brightness(1.08)}
@media (max-width:520px){#time{display:none}.controls{gap:10px;padding-inline:12px}.caption{padding:14px 16px}}

/* render mode (used to capture the MP4): stage fills the frame, captions sit on top of the picture */
html.render body{padding:0;overflow:hidden}
html.render .wrap{max-width:none;gap:0}
html.render header,html.render .hint,html.render .controls,html.render #endcard{display:none}
html.render body{background:#000}
html.render .wrap{padding-top:109px}
html.render .player{border-radius:0;box-shadow:none;position:relative;background:#000}
html.render .caption{height:110px;min-height:0;padding:0 60px}
html.render .caption p{font-size:33px;font-weight:700}

<script>
(function(){

  /* ---------- story script ---------- */
  var S=[
    {n:'Título',d:8,c:[[0,'Una historia bíblica para niños: Moisés y el mar Rojo.']]},
    {n:'Esclavos en Egipto',d:14,c:[[0,'El pueblo de Dios vivía en Egipto como esclavo y trabajaba muy duro haciendo ladrillos.'],[7.5,'Pero Dios había escuchado su clamor y tenía un plan para rescatarlos.']]},
    {n:'La zarza',d:14,c:[[0,'Dios llamó a Moisés desde una zarza que ardía sin quemarse: «Dile al faraón que deje ir a mi pueblo.»'],[8,'Y Moisés obedeció, aunque tenía miedo.']]},
    {n:'El faraón',d:14,c:[[0,'Moisés habló con el faraón, pero el faraón no quiso obedecer. Entonces Dios envió diez plagas sobre Egipto.'],[8,'Por fin, el faraón dijo: «Váyanse!»']]},
    {n:'La salida',d:16,b:[8],c:[[0,'Muchísimas familias salieron de Egipto, y Dios los guió con una columna de nube.'],[8,'Y de noche, los alumbró con una columna de fuego.']]},
    {n:'El ejército',d:14,c:[[0,'Pero el faraón cambió de idea. Reunió a su ejército, con carros y caballos, y salió a perseguirlos.'],[8,'¡Los soldados corrían como el viento!']]},
    {n:'Frente al mar',d:16,c:[[0,'El pueblo llegó al mar Rojo. Atrás venía el ejército, y adelante estaba el mar. ¡No había salida!'],[8,'Pero Moisés dijo: «No tengan miedo. Dios los salvará hoy.»']]},
    {n:'La vara',d:16,c:[[0,'Dios le dijo a Moisés que levantara su vara sobre el mar. Moisés la extendió, y Dios envió un fuerte viento.'],[8.5,'¡Las aguas se separaron, y apareció un camino seco!']]},
    {n:'Cruzando',d:16,c:[[0,'El pueblo cruzó por el camino seco, con paredes de agua a los lados. ¡Todos pasaron sanos y salvos!'],[8.5,'Los niños, los ancianos y los animales: nadie se quedó atrás.']]},
    {n:'Las aguas vuelven',d:14,b:[6.5],c:[[0,'Los egipcios los siguieron por el camino, pero Dios los detuvo.'],[6.5,'Moisés extendió su mano otra vez, y las aguas volvieron a su lugar. ¡El pueblo estaba a salvo!']]},
    {n:'La alabanza',d:14,c:[[0,'Al otro lado, el pueblo cantó y bailó para dar gracias a Dios.'],[7,'María, la hermana de Moisés, tomó su pandero y todos alabaron al Señor.']]},
    {n:'Fin',d:16,c:[[0,'Moisés nos enseña que Dios cuida a su pueblo, aun cuando parece que no hay salida. ¡Él abre caminos donde no los hay!'],[9.5,'«El Señor es mi fuerza y mi canto.» Éxodo 15:2']]}

  g10+='<g transform="translate(334 262)"><g class="tamb"><circle cx="0" cy="0" r="18" fill="#d9b44a" stroke="#8a6a2a" stroke-width="3"/><circle cx="0" cy="0" r="10" fill="#b5523b"/><circle cx="-18" cy="0" r="3" fill="#fff"/><circle cx="18" cy="0" r="3" fill="#fff"/><circle cx="0" cy="-18" r="3" fill="#fff"/><circle cx="0" cy="18" r="3" fill="#fff"/></g></g>';
  g10+=at(410,450,1.9,mix(MOS,{arms:'wave',mood:'happy',cls:'breath'}));
  $('g10').innerHTML=g10;
  $('h10').innerHTML='<g class="lbD"><text class="cz" x="44" y="112" font-size="44" fill="#f6e7bd" stroke="rgba(25,12,45,.7)" stroke-width="8" paint-order="stroke" style="letter-spacing:.08em">¡ALABEN AL SEÑOR!</text><path d="M46 126 H420" stroke="#e0b84a" stroke-width="2.5"/></g>';

  /* ---------- scene 11: the end ---------- */
  var g11='';[[100,456,1.3],[200,458,1.25],[600,456,1.3],[700,458,1.25],[770,460,1.2]].forEach(function(p,i){g11+=at(p[0],p[1],p[2],mix(folk(i+4),{arms:'cheer',cls:'hop',d:-i*.2}))});
  g11+=at(340,448,1.9,mix(MOS,{arms:'wave',cls:'breath'}))+at(470,450,1.8,mix(MIRI,{arms:'wave',mood:'happy',cls:'breath',d:-.5}));
  $('g11').innerHTML=g11;
  var f11='';[[210,170,0],[590,180,.8],[320,130,1.6],[490,140,.4],[400,120,1.2]].forEach(function(h){f11+='<polygon class="twinkle" points="'+star(h[0],h[1],4,9,3)+'" fill="#fff6cf" style="animation-delay:'+h[2]+'s"/>'});
  $('h11').innerHTML='<g class="popc" style="animation-delay:1.6s;transform-origin:400px 190px"><text class="cz" x="400" y="204" text-anchor="middle" font-size="96" fill="url(#goldT)" stroke="rgba(25,12,45,.7)" stroke-width="9" stroke-linejoin="round" paint-order="stroke" style="letter-spacing:.16em">FIN</text></g>'+f11;

  /* ---------- player engine ---------- */
  var stage=$('stage'),capText=$('capText'),playBtn=$('play'),segsEl=$('segs'),timeEl=$('time'),endcard=$('endcard');
  var groups=Array.prototype.map.call(document.querySelectorAll('.sg'),function(el){return {el:el,set:el.dataset.s.split(' ').map(Number)}});
  var idx=0,t=0,vt=0,playing=true,capKey='',lastTs=null,manual=false,fades=[],seen=new WeakSet();

  var ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';
  var ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';

  var segs=S.map(function(s,i){
    var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Escena '+(i+1)+': '+s.n);b.title=s.n;b.innerHTML='<i></i>';
    b.addEventListener('click',function(){seek(i)});segsEl.appendChild(b);return b;
  });

  function fmt(x){x=Math.floor(x);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}

  function restartAnims(el){
    el.getAnimations({subtree:true}).forEach(function(a){
      a.cancel();a.play();
      if(manual){a.pause();a.currentTime=0;seen.add(a)}
    });
  }
  function showScene(i,hard){
    purge=true;
    stage.dataset.scene=i;stage.dataset.beat='0';
    if(hard){fades=[];groups.forEach(function(g){g.el.classList.remove('on','fading')});void stage.getBoundingClientRect()}
    groups.forEach(function(g){
      var want=g.set.indexOf(i)>-1,isOn=g.el.classList.contains('on');
      if(want&&!isOn){g.el.classList.remove('fading');g.el.classList.add('on');restartAnims(g.el)}
      else if(!want&&isOn){g.el.classList.remove('on');g.el.classList.add('fading');fades=fades.filter(function(f){return f.el!==g.el});fades.push({el:g.el,at:vt+.7})}
    });
  }
  function setPaused(p){
    playing=!p;stage.classList.toggle('paused',p);
    playBtn.innerHTML=p?ICON_PLAY:ICON_PAUSE;playBtn.setAttribute('aria-label',p?'Reproducir':'Pausa');
  }
  function seek(i){
    idx=Math.max(0,Math.min(S.length-1,i));t=0;capKey='';endcard.hidden=true;
    stage.classList.toggle('settled',idx>=9);
    showScene(idx,true);setPaused(false);update();
  }
  var beatNow=0;
  function tick(){}
  function update(){
    var sc=S[idx],ci=0;
    sc.c.forEach(function(c,i){if(t>=c[0])ci=i});
    var key=idx+'-'+ci;
    if(key!==capKey){capKey=key;capText.classList.remove('in');void capText.offsetWidth;capText.textContent=sc.c[ci][1];capText.classList.add('in')}
    var bt=0;(sc.b||[]).forEach(function(x){if(t>=x)bt++});
    if(String(bt)!==stage.dataset.beat)stage.dataset.beat=String(bt);
    beatNow=bt;
    tick();
    var done=0;
    segs.forEach(function(el,i){
      var p=i<idx?1:(i===idx?Math.min(1,t/sc.d):0);
      el.style.setProperty('--p',p);
      if(i<idx)done+=S[i].d;
    });
    timeEl.textContent=fmt(done+t)+' / '+fmt(TOTAL);
  }
  function advance(dt){
    t+=dt;vt+=dt;
    fades=fades.filter(function(f){if(vt>=f.at){f.el.classList.remove('fading');return false}return true});
    var sc=S[idx];
    if(t>=sc.d){
      if(idx<S.length-1){idx++;t=0;showScene(idx,false)}
      else{t=sc.d;setPaused(true);endcard.hidden=false}
    }
    update();
  }
  function frame(ts){
    if(lastTs===null)lastTs=ts;
    var dt=Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
    if(!manual&&playing)advance(dt);
    requestAnimationFrame(frame);
  }
  // frame-exact stepping used when capturing the MP4: every CSS animation and transition is driven by hand
  var purge=false;
  function freeze(dt){
    document.getAnimations().forEach(function(a){
      if(purge&&a.animationName&&a.effect&&a.effect.target){
        var nm=getComputedStyle(a.effect.target).animationName.split(',').map(function(x){return x.trim()});
        if(nm.indexOf(a.animationName)<0){a.cancel();return}
      }
      if(!seen.has(a)){seen.add(a);a.pause();a.currentTime=0}
      else a.currentTime=(+a.currentTime||0)+dt*1000;
    });
    purge=false;
  }

  playBtn.addEventListener('click',function(){
    if(!endcard.hidden){seek(0);return}
    setPaused(playing);
  });
  $('replay').addEventListener('click',function(){seek(0)});
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
    if(e.key===' '||e.key==='k'){e.preventDefault();if(!endcard.hidden)seek(0);else setPaused(playing)}
    else if(e.key==='ArrowRight')seek(idx+1);
    else if(e.key==='ArrowLeft')seek(idx-1);
  });

  window.__story={
    seek:seek,
    pause:function(){setPaused(true)},
    manual:function(){manual=true;seek(0);freeze(0)},
    step:function(dt){advance(dt);freeze(dt)},
    state:function(){return {idx:idx,t:t}}
  };
  showScene(0,true);setPaused(false);update();
  requestAnimationFrame(frame);
})();
</script>
