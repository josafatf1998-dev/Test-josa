<title>David y Goliat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
@property --sky1{syntax:'<color>';inherits:true;initial-value:#8fd8ff}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#e9f8ff}
@property --grade{syntax:'<color>';inherits:true;initial-value:rgba(255,200,120,.08)}

/* Layout: a centered 16:9 cinematic stage, a cream caption strip under it, and a slim control bar with one segment per scene. */
:root{
  --ink:#1b1f4b;
  --ink-2:#262b66;
  --paper:#fff6e0;
  --sun:#ffc43d;
  --rose:#ff6b6b;
  --leaf:#4cb87a;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --lap5:4.5s;
  --lap6:2.8s;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;padding-inline:16px;padding-block:24px 48px;font-size:16px}
.wrap{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{margin:0;font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,2.9rem);line-height:1.05;text-wrap:balance}
.player{background:var(--ink-2);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.screen{position:relative;line-height:0;aspect-ratio:2.35/1;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;height:auto;display:block;aspect-ratio:16/9;--sky1:#8fd8ff;--sky2:#e9f8ff;--grade:rgba(255,200,120,.08);transition:--sky1 1.6s,--sky2 1.6s,--grade 1.6s;user-select:none}
.caption{background:#07070c;color:#fff;padding:14px 22px;min-height:calc(1.4em*2 + 28px);display:flex;align-items:center;justify-content:center;text-align:center}
.caption p{margin:0;font-weight:800;font-size:clamp(1.05rem,1.2rem + .6vw,1.55rem);line-height:1.4;text-wrap:pretty}
.caption p.in{animation:capIn .5s ease-out both}
.controls{display:flex;align-items:center;gap:14px;padding:12px 16px}
#play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--sun);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#play svg{width:22px;height:22px;fill:currentColor}
#play:hover{filter:brightness(1.08)}
.segs{flex:1;min-width:0;display:flex;gap:4px}
.segs button{flex:1;min-width:0;height:30px;padding:11px 0;border:0;background:none;cursor:pointer}
.segs i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.segs i::after{content:'';display:block;height:100%;background:var(--sun);transform-origin:left;transform:scaleX(var(--p,0))}
.segs button:hover i{background:rgba(255,255,255,.32)}
#time{flex:none;font-variant-numeric:tabular-nums;font-weight:800;font-size:.9rem;opacity:.85}
button:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:8px}
.hint{margin:0;font-size:.9rem;opacity:.75;text-wrap:pretty}
#endcard{position:absolute;inset:0;display:grid;place-items:center;background:rgba(27,31,75,.5)}
#endcard[hidden]{display:none}
#replay{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3vw,1.9rem);background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:.55em 1.3em;cursor:pointer;line-height:1.2}
#replay:hover{filter:brightness(1.08)}
@media (max-width:520px){#time{display:none}.controls{gap:10px;padding-inline:12px}.caption{padding:14px 16px}}

/* render mode (used to capture the MP4): stage fills the frame, captions sit on top of the picture */
html.render body{padding:0;overflow:hidden}
html.render .wrap{max-width:none;gap:0}
html.render header,html.render .hint,html.render .controls,html.render #endcard{display:none}
html.render body{background:#000}
html.render .wrap{padding-top:109px}
html.render .player{border-radius:0;box-shadow:none;position:relative;background:#000}
html.render .caption{height:110px;min-height:0;padding:0 60px}
html.render .caption p{font-size:33px;font-weight:700}

/* ---- stage scenery ---- */
.sg{display:none}
.sg.on,.sg.fading{display:inline}
.sg.on{animation:fadein .6s both}
.sg.fading{animation:fadeout .6s both}
#stage.paused *{animation-play-state:paused!important}
svg text{font-family:var(--display);font-weight:800}

.cloud{animation:drift 80s linear infinite}


#cam{transform-origin:0 0;transition:transform 2.3s cubic-bezier(.45,0,.2,1)}

.bob{animation:bob .42s ease-in-out infinite}
.bob8{animation:bob .42s ease-in-out 8}
.hop{animation:hop .6s ease-in-out infinite}
.breath{animation:breath 3.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.note{animation:noteUp 1.6s ease-out infinite}
.palmtop{transform-origin:0 -100px;animation:sway 4s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.3s ease-out infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:dust 3.4s ease-out both}
.popb{transform-box:fill-box;transform-origin:center bottom;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.popc{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.4s ease-in-out infinite}
.beam{animation:pulse 2.6s ease-in-out infinite}
.walkin{animation:walkin 3.2s ease-out both}
.floaty{animation:floaty 3s ease-in infinite}
.rb{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}



svg text.cz{font-family:'Cinzel','Trajan Pro','Times New Roman',serif;font-weight:800;letter-spacing:.06em}
.rays2{opacity:.55;animation:raysway 14s ease-in-out infinite alternate}
.mote{animation:mote 14s linear infinite}
#dolly{transform-origin:400px 260px}
@keyframes raysway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.85}100%{transform:translate(var(--mx),-110px);opacity:0}}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
@keyframes fadeLoc{0%{opacity:0;transform:translateX(-24px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

#sun{transform:translate(650px,90px);transition:transform 2.4s ease}
[data-scene="10"] #sun{transform:translate(560px,170px)}
.flashr{opacity:0}
[data-scene="0"]{--sky1:#78c4fb;--sky2:#eaf7ff;--grade:rgba(255,210,130,.08)}
[data-scene="1"]{--sky1:#78c4fb;--sky2:#eaf7ff;--grade:rgba(255,210,130,.06)}
[data-scene="2"]{--sky1:#a3bfd9;--sky2:#e8eef2;--grade:rgba(90,110,150,.18)}
[data-scene="3"]{--sky1:#8b9cb6;--sky2:#d9d2cc;--grade:rgba(70,60,90,.28)}
[data-scene="4"]{--sky1:#9fcbe8;--sky2:#f1e8d6;--grade:rgba(255,205,140,.1)}
[data-scene="5"]{--grade:rgba(255,150,70,.22)}
[data-scene="6"]{--sky1:#8fd0f0;--sky2:#eef6ea;--grade:rgba(120,200,160,.1)}
[data-scene="7"]{--sky1:#ffcf8a;--sky2:#fff1cf;--grade:rgba(255,170,70,.2)}
[data-scene="8"]{--sky1:#ffbf7a;--sky2:#ffe8c4;--grade:rgba(255,150,60,.22)}
[data-scene="9"]{--sky1:#8fd8ff;--sky2:#fff2cf;--grade:rgba(255,215,130,.14)}
[data-scene="10"]{--sky1:#ff9a68;--sky2:#ffe3a6;--grade:rgba(255,150,80,.2)}
[data-scene="3"] #shake{animation:shake3 .55s linear infinite}
[data-scene="8"][data-beat="3"] #shake{animation:shake2 .1s linear 16}
[data-scene="8"][data-beat="3"] .flashr{animation:flash 1.2s ease-out both}
#dolly{transform-origin:400px 260px}
[data-scene="0"] #dolly{transform-origin:590px 300px;animation:dz0 8s ease-in-out both}
[data-scene="1"] #dolly{transform-origin:450px 300px;animation:dz1 16s ease-in-out both}
[data-scene="2"] #dolly{transform-origin:400px 260px;animation:dz2 16s ease-out both}
[data-scene="3"] #dolly{transform-origin:620px 260px;animation:dz3 18s ease-in both}
[data-scene="4"] #dolly{transform-origin:300px 300px;animation:dz4 14s linear both}
[data-scene="5"] #dolly{transform-origin:500px 300px;animation:dz5 16s ease-in-out both}
[data-scene="6"] #dolly{transform-origin:300px 380px;animation:dz6 14s ease-in-out both}
[data-scene="7"] #dolly{transform-origin:400px 300px;animation:dz7 18s linear both}
[data-scene="8"] #dolly{transform-origin:450px 300px;animation:dz8 14s ease-in both}
[data-scene="9"] #dolly{transform-origin:400px 300px;animation:dz9 14s ease-out both}
[data-scene="10"] #dolly{transform-origin:400px 320px;animation:dz10 16s ease-out both}
@keyframes dz0{from{transform:scale(1.02)}to{transform:scale(1.14)}}
@keyframes dz1{from{transform:scale(1.06) translateX(26px)}to{transform:scale(1.16) translateX(-26px)}}
@keyframes dz2{from{transform:scale(1.25)}to{transform:scale(1)}}
@keyframes dz3{from{transform:scale(1)}to{transform:scale(1.2)}}
@keyframes dz4{from{transform:scale(1.05) translateX(10px)}to{transform:scale(1.15) translateX(-10px)}}
@keyframes dz5{from{transform:scale(1)}to{transform:scale(1.15)}}
@keyframes dz6{from{transform:scale(1.14)}to{transform:scale(1)}}
@keyframes dz7{from{transform:scale(1)}to{transform:scale(1.18)}}
@keyframes dz8{from{transform:scale(1)}to{transform:scale(1.14)}}
@keyframes dz9{from{transform:scale(1.2)}to{transform:scale(1)}}
@keyframes dz10{from{transform:scale(1.25)}to{transform:scale(1)}}
.shiv{animation:shiv .14s linear infinite}
.wobble{animation:wobble 1.3s ease-in-out infinite}
.sheepb{animation:bob 2.6s ease-in-out infinite}
.grazeh{animation:graze 3.2s ease-in-out infinite}
.slingspin{animation:spinS .28s linear infinite}
[data-scene="8"]:not([data-beat="0"]) .slingspin{display:none}
.strings{animation:pulse .35s ease-in-out infinite}
.flag{animation:flagw 2s ease-in-out infinite}
.rip{animation:ripple 3s ease-in-out infinite}
.lamp{animation:pulse 2.4s ease-in-out infinite}
.m5a{display:inline}.m5b{display:none}
[data-scene="5"][data-beat="1"] .m5a{display:none}
[data-scene="5"][data-beat="1"] .m5b{display:inline}
.stone,.impact,.dust8{display:none}
[data-scene="8"][data-beat="1"] .stone{display:inline;animation:stoneFly .75s linear both}
[data-scene="8"][data-beat="2"] .impact{display:inline}
[data-scene="8"][data-beat="3"] .dust8{display:inline}
@keyframes shake3{0%,100%{transform:translate(0,0)}50%{transform:translate(0,1.6px)}}
@keyframes shiv{0%,100%{transform:translateX(-1.2px)}50%{transform:translateX(1.2px)}}
@keyframes wobble{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@keyframes graze{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
@keyframes spinS{to{transform:rotate(360deg)}}
@keyframes flagw{0%,100%{transform:skewY(-6deg)}50%{transform:skewY(6deg)}}
@keyframes ripple{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(14px);opacity:.25}}
@keyframes stoneFly{0%{transform:translate(0,0)}50%{transform:translate(171px,-70px)}100%{transform:translate(342px,-58px)}}
@keyframes topple{0%{transform:rotate(0)}65%{transform:rotate(-88deg)}82%{transform:rotate(-84deg)}100%{transform:rotate(-87deg)}}
@keyframes gStep{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes dRun{from{transform:translateX(0)}to{transform:translateX(150px)}}
@keyframes flee{from{transform:translateX(0)}to{transform:translateX(620px)}}
@keyframes charge{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
@keyframes capIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.012)}}
@keyframes waveU{0%,100%{transform:rotate(-140deg)}50%{transform:rotate(-158deg)}}
@keyframes waveF{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-52deg)}}
@keyframes cheerLU{0%,100%{transform:rotate(146deg)}50%{transform:rotate(164deg)}}
@keyframes cheerLF{0%,100%{transform:rotate(10deg)}50%{transform:rotate(32deg)}}
@keyframes cheerRU{0%,100%{transform:rotate(-146deg)}50%{transform:rotate(-164deg)}}
@keyframes cheerRF{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-32deg)}}
@keyframes swingA{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes swingB{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes step{0%{transform:translate(5px,0)}25%{transform:translate(0,-3px)}50%{transform:translate(-5px,0)}100%{transform:translate(5px,0)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1000px)}}
@keyframes sunspin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-160px);opacity:0}60%{transform:translateY(12px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,-1px)}}
@keyframes shake2{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}}
@keyframes ring{0%{transform:scale(.3);opacity:.95}100%{transform:scale(3.4);opacity:0}}
@keyframes noteUp{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(10px,-42px);opacity:0}}
@keyframes dust{0%{transform:scale(.2);opacity:0}20%{opacity:.95}100%{transform:scale(2.8) translateY(-14px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.25);opacity:1}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes peek{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes walkin{from{transform:translateX(-360px)}to{transform:translateX(0)}}
@keyframes floaty{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#shake,.cloud,#sun .rays{animation:none!important}}
</style>

<main class="wrap">
  <header>
    <p class="eyebrow">Historia bíblica para niños · 1 Samuel 17</p>
    <h1>David y Goliat</h1>
  </header>

  <section class="player" aria-label="Historia animada">
    <div class="screen">
      <svg id="stage" viewBox="0 0 800 450" role="img" aria-label="Dibujos animados de David y Goliat" data-scene="0" data-beat="0">
        <defs>
          <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#d79a22"/></linearGradient>
          <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7c2" stop-opacity=".95"/><stop offset="1" stop-color="#fff7c2" stop-opacity="0"/></linearGradient>
          <radialGradient id="glowG"><stop offset="0" stop-color="#ffe27a" stop-opacity=".95"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>

          <linearGradient id="robeShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>
          <linearGradient id="hemShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
          <linearGradient id="staffG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a9743a"/><stop offset="1" stop-color="#6a4118"/></linearGradient>

          <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dca2"/><stop offset="1" stop-color="#e0b878"/></linearGradient>
          <linearGradient id="st0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d09a"/><stop offset="1" stop-color="#d8b178"/></linearGradient>
          <linearGradient id="st1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c58a"/><stop offset="1" stop-color="#cf9f66"/></linearGradient>
          <linearGradient id="st2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edcb92"/><stop offset="1" stop-color="#d5a96f"/></linearGradient>
          <linearGradient id="st3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2bb7e"/><stop offset="1" stop-color="#c79860"/></linearGradient>
          <radialGradient id="vigG" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#120a22" stop-opacity="0"/><stop offset="1" stop-color="#120a22" stop-opacity=".55"/></radialGradient>
          <radialGradient id="sunG"><stop offset="0" stop-color="#fffbe6"/><stop offset=".6" stop-color="#ffe9a0"/><stop offset="1" stop-color="#ffc94a"/></radialGradient>
          <linearGradient id="rayG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="goldT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6cf"/><stop offset=".5" stop-color="#f2c75a"/><stop offset="1" stop-color="#b9821f"/></linearGradient>
          <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0cf7a"/><stop offset=".5" stop-color="#c58f2e"/><stop offset="1" stop-color="#7a4f14"/></linearGradient>
          <pattern id="scalesP" width="6" height="5" patternUnits="userSpaceOnUse"><path d="M0 5 Q3 -1 6 5" stroke="rgba(60,30,0,.4)" fill="none" stroke-width=".7"/></pattern>

          <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9bd3ea"/><stop offset="1" stop-color="#5a9fc4"/></linearGradient>
        </defs>

        <rect width="800" height="450" fill="url(#skyG)"/>

        <g id="sun">
          <g class="rays2" id="rays2"></g>
          <circle r="150" fill="url(#glowG)" opacity=".55"/>
          <circle r="30" fill="url(#sunG)"/>
          <ellipse rx="190" ry="2.2" fill="#fff" opacity=".35"/>
          <ellipse rx="70" ry="1.2" fill="#fff" opacity=".6"/>
        </g>

        <g id="clouds" fill="#fff" opacity=".92">
          <g class="cloud" style="animation-delay:-18s"><g transform="translate(0 70)"><circle cx="0" cy="0" r="20"/><circle cx="24" cy="-10" r="26"/><circle cx="52" cy="0" r="20"/><rect x="-8" y="0" width="70" height="20" rx="10"/></g></g>
          <g class="cloud" style="animation-delay:-48s;animation-duration:100s"><g transform="translate(0 130) scale(.8)"><circle cx="0" cy="0" r="20"/><circle cx="24" cy="-10" r="26"/><circle cx="52" cy="0" r="20"/><rect x="-8" y="0" width="70" height="20" rx="10"/></g></g>
          <g class="cloud" style="animation-delay:-70s;animation-duration:90s"><g transform="translate(0 40) scale(.65)"><circle cx="0" cy="0" r="20"/><circle cx="24" cy="-10" r="26"/><circle cx="52" cy="0" r="20"/><rect x="-8" y="0" width="70" height="20" rx="10"/></g></g>
        </g>

        <g id="shake"><g transform="translate(0 -52)"><g id="dolly"><g id="cam">
          <path d="M0 238 Q120 188 260 228 T520 214 T800 198 V430 H0Z" fill="#b7c7ad"/>
          <g id="pasture" class="sg" data-s="0 1 10">
            <path d="M0 300 Q200 246 420 298 T800 286 V430 H0Z" fill="#8fc27f"/>

    '<g transform="rotate(-87 580 442)">'+at(580,442,2.6,mix(GOL,{arms:'down',mood:'worry'}))+'</g>'+
    at(80,446,1.25,mix(isr(0),{arms:'cheer',cls:'hop',d:-.1}))+at(150,448,1.3,mix(isr(2),{arms:'cheer',cls:'hop',d:-.3}))+at(380,448,1.25,mix(isr(1),{arms:'cheer',cls:'hop',d:-.5}))+
    at(250,442,1.6,mix(DAV,{staff:0,arms:'cheer',mood:'happy'}));

  /* ---------- scene 10: finale ---------- */
  $('g10').innerHTML=
    sheep(150,444,1.3,0)+sheep(260,450,1.0,.9,true)+sheep(570,448,1.2,.5)+sheep(670,442,1.0,1.4,true)+
    at(90,446,1.1,mix(isr(1),{arms:'cheer',cls:'hop',d:-.2}))+at(740,446,1.1,mix(isr(3),{arms:'cheer',cls:'hop',d:-.5}))+
    at(400,444,1.6,mix(DAV,{arms:'down',cls:'breath'}));
  var fh='';[[210,170,0],[590,180,.8],[320,130,1.6],[490,140,.4],[400,120,1.2]].forEach(function(h){
    fh+='<polygon class="twinkle" points="'+star(h[0],h[1],4,9,3)+'" fill="#fff6cf" style="animation-delay:'+h[2]+'s"/>';
  });
  $('h10').innerHTML='<g class="popc" style="animation-delay:1.6s;transform-origin:400px 190px"><text class="cz" x="400" y="204" text-anchor="middle" font-size="96" fill="url(#goldT)" stroke="rgba(25,12,45,.7)" stroke-width="9" stroke-linejoin="round" paint-order="stroke" style="letter-spacing:.16em">FIN</text></g>'+fh;

  /* ---------- player engine ---------- */
  var stage=$('stage'),capText=$('capText'),playBtn=$('play'),segsEl=$('segs'),timeEl=$('time'),endcard=$('endcard');
  var groups=Array.prototype.map.call(document.querySelectorAll('.sg'),function(el){return {el:el,set:el.dataset.s.split(' ').map(Number)}});
  var idx=0,t=0,vt=0,playing=true,capKey='',lastTs=null,manual=false,fades=[],seen=new WeakSet();

  var ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';
  var ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';

  var segs=S.map(function(s,i){
    var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Escena '+(i+1)+': '+s.n);b.title=s.n;b.innerHTML='<i></i>';
    b.addEventListener('click',function(){seek(i)});segsEl.appendChild(b);return b;
  });

  function fmt(x){x=Math.floor(x);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}

  function restartAnims(el){
    el.getAnimations({subtree:true}).forEach(function(a){
      a.cancel();a.play();
      if(manual){a.pause();a.currentTime=0;seen.add(a)}
    });
  }
  function showScene(i,hard){
    purge=true;
    stage.dataset.scene=i;stage.dataset.beat='0';
    if(hard){fades=[];groups.forEach(function(g){g.el.classList.remove('on','fading')});void stage.getBoundingClientRect()}
    groups.forEach(function(g){
      var want=g.set.indexOf(i)>-1,isOn=g.el.classList.contains('on');
      if(want&&!isOn){g.el.classList.remove('fading');g.el.classList.add('on');restartAnims(g.el)}
      else if(!want&&isOn){g.el.classList.remove('on');g.el.classList.add('fading');fades=fades.filter(function(f){return f.el!==g.el});fades.push({el:g.el,at:vt+.7})}
    });
  }
  function setPaused(p){
    playing=!p;stage.classList.toggle('paused',p);
    playBtn.innerHTML=p?ICON_PLAY:ICON_PAUSE;playBtn.setAttribute('aria-label',p?'Reproducir':'Pausa');
  }
  function seek(i){
    idx=Math.max(0,Math.min(S.length-1,i));t=0;capKey='';endcard.hidden=true;
    stage.classList.toggle('settled',idx>=9);
    showScene(idx,true);setPaused(false);update();
  }
  var beatNow=0;
  function tick(){
    if(idx===6){for(var i=0;i<5;i++)stoneEls[i].setAttribute('fill',i<beatNow?'#d9ceb6':'rgba(30,25,40,.55)')}
  }
  function update(){
    var sc=S[idx],ci=0;
    sc.c.forEach(function(c,i){if(t>=c[0])ci=i});
    var key=idx+'-'+ci;
    if(key!==capKey){capKey=key;capText.classList.remove('in');void capText.offsetWidth;capText.textContent=sc.c[ci][1];capText.classList.add('in')}
    var bt=0;(sc.b||[]).forEach(function(x){if(t>=x)bt++});
    if(String(bt)!==stage.dataset.beat)stage.dataset.beat=String(bt);
    beatNow=bt;
    tick();
    var done=0;
    segs.forEach(function(el,i){
      var p=i<idx?1:(i===idx?Math.min(1,t/sc.d):0);
      el.style.setProperty('--p',p);
      if(i<idx)done+=S[i].d;
    });
    timeEl.textContent=fmt(done+t)+' / '+fmt(TOTAL);
  }
  function advance(dt){
    t+=dt;vt+=dt;
    fades=fades.filter(function(f){if(vt>=f.at){f.el.classList.remove('fading');return false}return true});
    var sc=S[idx];
    if(t>=sc.d){
      if(idx<S.length-1){idx++;t=0;showScene(idx,false)}
      else{t=sc.d;setPaused(true);endcard.hidden=false}
    }
    update();
  }
  function frame(ts){
    if(lastTs===null)lastTs=ts;
    var dt=Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
    if(!manual&&playing)advance(dt);
    requestAnimationFrame(frame);
  }
  // frame-exact stepping used when capturing the MP4: every CSS animation and transition is driven by hand
  var purge=false;
  function freeze(dt){
    document.getAnimations().forEach(function(a){
      if(purge&&a.animationName&&a.effect&&a.effect.target){
        var nm=getComputedStyle(a.effect.target).animationName.split(',').map(function(x){return x.trim()});
        if(nm.indexOf(a.animationName)<0){a.cancel();return}
      }
      if(!seen.has(a)){seen.add(a);a.pause();a.currentTime=0}
      else a.currentTime=(+a.currentTime||0)+dt*1000;
    });
    purge=false;
  }

  playBtn.addEventListener('click',function(){
    if(!endcard.hidden){seek(0);return}
    setPaused(playing);
  });
  $('replay').addEventListener('click',function(){seek(0)});
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
    if(e.key===' '||e.key==='k'){e.preventDefault();if(!endcard.hidden)seek(0);else setPaused(playing)}
    else if(e.key==='ArrowRight')seek(idx+1);
    else if(e.key==='ArrowLeft')seek(idx-1);
  });

  window.__story={
    seek:seek,
    pause:function(){setPaused(true)},
    manual:function(){manual=true;seek(0);freeze(0)},
    step:function(dt){advance(dt);freeze(dt)},
    state:function(){return {idx:idx,t:t}}
  };
  showScene(0,true);setPaused(false);update();
  requestAnimationFrame(frame);
})();
</script>
